# 历史原因：旧内核未编 CONFIG_SND_SEQUENCER 时，snd-seq.ko 不存在，
# Fedora 的 alsa-lib 在 /usr/lib/modprobe.d/dist-alsa.conf 里给 snd-pcm 挂了
# `&& /sbin/modprobe snd-seq` 会报错 "Module snd-seq not found"，
# 因而曾用此同名文件遮住发行版配置，只保留加载 snd-pcm。
#
# 当前内核已将 CONFIG_SND_SEQUENCER 编为模块（=m），snd_seq 已可正常加载。
# 待包升级与对应测试断言统一收尾清理后，此覆盖文件即可移除。
install snd-pcm /sbin/modprobe --ignore-install snd-pcm
