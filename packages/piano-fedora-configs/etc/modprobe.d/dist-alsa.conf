# 这个内核没有编 CONFIG_SND_SEQUENCER，snd-seq.ko 根本不存在。
# Fedora 的 alsa-lib 在 /usr/lib/modprobe.d/dist-alsa.conf 里给 snd-pcm 挂了
# `&& /sbin/modprobe snd-seq`，每次加载声卡都留一条 "Module snd-seq not found"。
#
# kmod 按文件名全局排序、取先命中的那条，换个名字压不住发行版那份，只能用
# 同名文件遮住它。这里只保留加载 snd-pcm 的那一半。厂商 Android 内核的三份
# 配置同样没开这一项，SunUEFI 的白名单也不含它，所以不是漏编。
# 上游哪天开了 CONFIG_SND_SEQUENCER，删掉这个文件即可。
install snd-pcm /sbin/modprobe --ignore-install snd-pcm
