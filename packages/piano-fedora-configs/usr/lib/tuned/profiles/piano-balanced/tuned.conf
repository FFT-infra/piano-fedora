# SPDX-License-Identifier: MIT
#
# Balanced ceiling, the default profile. It is SunUEFI's piano-balanced with
# lower CPU ceilings: policy0 2400000 kHz and policy6 3283200 kHz instead of
# 3532800 and 4089600.
#
# Nothing throttles on the temperature of the back cover: the piano-skin thermal
# zone has no trip point. With all eight cores busy for eight minutes, the full
# ceilings hold the SoC near its 95 C passive trip and take the back from 30 C
# to 43 C, still rising. At these ceilings the SoC stays near 65 C and the back
# reaches 35 C in the same time, for four fifths of the throughput. The full
# ceilings are in the performance profile. Return to SunUEFI's values when the
# skin zone has a trip point.
#
# Only the GPU ceiling is written, never its floor; see the power-saver profile
# for why the floor is left alone.
[main]
summary=Piano balanced CPU and GPU policy

[sysfs]
/sys/devices/system/cpu/cpufreq/boost=0
/sys/devices/system/cpu/cpufreq/policy0/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy6/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=384000
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=1017600
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=2400000
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=3283200
/sys/class/devfreq/3d00000.gpu/max_freq=1100000000
