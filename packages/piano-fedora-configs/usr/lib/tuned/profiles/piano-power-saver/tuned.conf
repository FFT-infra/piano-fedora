#
# uperf-linux owns every cpufreq and devfreq knob on this image: it starts at
# boot, scales both clusters and the GPU from its own power model, and rewrites
# anything else that touches those files within seconds. So the PPD profile
# does not carry sysfs values here -- it switches uperf's own power mode and
# lets that daemon decide the ceilings. Writing scaling_max_freq or the GPU
# ceiling from TuneD would be a second owner, and a low ceiling left behind
# after switching back (the GPU ceiling is sticky) costs performance.
#
# The three uperf modes line up one to one with GNOME's three power modes.
[main]
summary=Piano power saver CPU and GPU policy

[script]
script=${i:PROFILE_DIR}/apply.sh
