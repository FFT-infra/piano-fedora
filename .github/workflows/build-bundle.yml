name: build-bundle

# 只使用同一次集成产生的 root/image/initramfs，按其 source-runs.json 取内核。
on:
  workflow_dispatch:
    inputs:
      root_image_artifact:
        description: "完整集成镜像 artifact"
        required: false
        default: "root-image-8192"
      uefi_artifact:
        description: "UEFI artifact"
        required: false
        default: "uefi-product"
      root_image_run_id:
        description: "固定本次完整集成镜像的成功 run"
        required: false
        default: ""
      uefi_run_id:
        description: "固定 UEFI 的成功 run；仍核对实际源码和补丁"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd dosfstools mtools device-tree-compiler python3 git

      - name: Resolve complete image and UEFI inputs
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT_IMAGE: ${{ inputs.root_image_artifact }}
          UEFI_ARTIFACT: ${{ inputs.uefi_artifact }}
          ROOT_RUN: ${{ inputs.root_image_run_id }}
          UEFI_RUN: ${{ inputs.uefi_run_id }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ROOT_RUN" ]; then args+=(--run-id "$ROOT_RUN"); fi
          python3 scripts/resolve-artifact-run.py --workflow build-image.yml --artifact "$ROOT_IMAGE" --output-key root_run "${args[@]}"
          uefi_args=()
          if [ -n "$UEFI_RUN" ]; then uefi_args+=(--run-id "$UEFI_RUN"); fi
          python3 scripts/resolve-artifact-run.py --workflow build-uefi.yml --artifact "$UEFI_ARTIFACT" --output-key uefi_run "${uefi_args[@]}"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.root_image_artifact }}
          path: build/in/image
          run-id: ${{ steps.src.outputs.root_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.uefi_artifact }}
          path: build/in/uefi
          run-id: ${{ steps.src.outputs.uefi_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the exact integrated kernel
        id: kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 镜像记录里写明了它消费的内核 artifact；旧记录没有这个字段时默认正式档。
          # 只允许两档，避免记录被改写后下载到无关 artifact。
          record=build/in/image/source-runs.json
          kernel_artifact=$(python3 -c 'import json;print(json.load(open("'"$record"'")).get("kernel_artifact","kernel-release-7.2.9"))')
          case "$kernel_artifact" in
            kernel-release-7.2.9|kernel-experimental-gunyah) ;;
            *) echo "recorded kernel_artifact is not allowed: $kernel_artifact" >&2; exit 2 ;;
          esac
          run=$(python3 -c 'import json;print(json.load(open("'"$record"'"))["kernel_run"])')
          echo "kernel_artifact=$kernel_artifact" >> "$GITHUB_OUTPUT"
          python3 scripts/resolve-artifact-run.py --workflow build-kernel.yml --artifact "$kernel_artifact" --run-id "$run"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.kernel.outputs.kernel_artifact }}
          path: build/in/kernel
          run-id: ${{ steps.kernel.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack the isolated components and verify identity
        env:
          KERNEL_ARTIFACT: ${{ steps.kernel.outputs.kernel_artifact }}
        run: |
          set -euo pipefail
          mkdir -p build/kernel build/uefi build/initramfs build/device-root
          # 实验 artifact 同时带内核 tar 与 SDK tar，只解与记录同名的那一个。
          tar -I zstd -xf "build/in/kernel/$KERNEL_ARTIFACT.tar.zst" -C build/kernel
          tar -I zstd -xf build/in/uefi/*.tar.zst -C build/uefi
          tar -I zstd -xf build/in/image/initramfs.tar.zst -C build/initramfs
          sudo tar -I zstd --numeric-owner --xattrs --xattrs-include='*' --acls --selinux -xf build/in/image/device-root.tar.zst -C build/device-root
          (cd build/in/image && sha256sum -c image-SHA256SUMS)
          cmp build/kernel/manifest.json build/in/image/kernel-manifest.json
          python3 scripts/checkout-sources.py --output build/sources --mode boot

      - name: Seal the actual UEFI source and project patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UEFI_RUN: ${{ steps.src.outputs.uefi_run }}
        run: |
          set -euo pipefail
          python3 scripts/seal-uefi-source.py --run-id "$UEFI_RUN" \
            --image build/uefi/PianoUEFI-product.img --output build/uefi-source.json

      - name: Create the upstream-compatible ESP and Linux boot payload
        run: |
          set -euo pipefail
          # stock Android BOOT 包装仍要求本机当前 BOOT，通用包不冒充已部署合体 BOOT。
          sudo python3 build/sources/sunuefi/tools/package_release.py \
            --uefi build/uefi/PianoUEFI-product.img --kernel build/kernel \
            --dtb build/sources/sunuefi/vendor/piano-linux/board.dtb \
            --cpu-model-overlay build/sources/sunuefi/linux/dts/piano-cpu-model.dtso \
            --panel-vendor auto \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-board-identity.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-regdma-resource.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-audio-dmic-clock.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-camera-flash.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-camera-privacy-led.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-touch-panel.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-pen-dock.dtso \
            --initramfs build/initramfs/initramfs.cpio.gz \
            --rootfs build/device-root/rootfs --rootfs-manifest build/device-root/manifest.json \
            --root-selector LABEL=PIANOROOT --esp-size-mib 512 --output build/packaged

      - name: Assemble and verify the delivery set
        env:
          UEFI_RUN: ${{ steps.src.outputs.uefi_run }}
          ROOT_RUN: ${{ steps.src.outputs.root_run }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          sudo cp build/packaged/esp.img build/packaged/boot.img build/packaged/PianoUEFI-product.img bundle/
          cp build/in/image/pianoroot.f2fs.img.zst bundle/
          cp build/in/image/diagnostic-abl-storage.tar.zst bundle/
          cp build/in/image/root-image-manifest.json build/in/image/source-runs.json build/in/image/runtime-manifest.json bundle/
          cp build/in/image/mesa-manifest.json build/in/image/ffmpeg-manifest.json build/in/image/rootfs-manifest.json bundle/
          cp build/kernel/manifest.json bundle/kernel-manifest.json
          cp build/uefi-source.json bundle/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('bundle/source-runs.json')
          record = json.loads(path.read_text())
          record.update(uefi_run=os.environ['UEFI_RUN'], image_run=os.environ['ROOT_RUN'],
                        bundle_source_commit=os.environ['GITHUB_SHA'])
          path.write_text(json.dumps(record, indent=2) + '\n')
          PY
          cp build/initramfs/manifest.json bundle/initramfs-manifest.json
          sudo cp build/packaged/manifest.json bundle/esp-manifest.json
          sudo chown -R "$(id -u):$(id -g)" bundle
          python3 scripts/verify-bundle.py --bundle bundle --write-manifest
          (cd bundle && sha256sum -c SHA256SUMS)
          ls -lh bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
