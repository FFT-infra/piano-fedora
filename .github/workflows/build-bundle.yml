name: build-bundle

# 只使用同一次集成产生的 root/image/initramfs，按其 source-runs.json 取内核。
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "桌面档；root_image_artifact 留空时由它推导 root-image-<releasever>-<desktop>"
        required: false
        default: "gnome"
      root_image_artifact:
        description: "完整集成镜像 artifact；留空则按桌面档推导"
        required: false
        default: ""
      uefi_artifact:
        description: "UEFI artifact"
        required: false
        default: "uefi-product"
      root_image_run_id:
        description: "固定本次完整集成镜像的成功 run"
        required: false
        default: ""
      uefi_run_id:
        description: "固定 UEFI 的成功 run；仍核对实际源码和补丁"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd dosfstools mtools device-tree-compiler python3 git gcc make flex bison

      - name: Resolve complete image and UEFI inputs
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP: ${{ inputs.desktop }}
          ROOT_IMAGE: ${{ inputs.root_image_artifact }}
          UEFI_ARTIFACT: ${{ inputs.uefi_artifact }}
          ROOT_RUN: ${{ inputs.root_image_run_id }}
          UEFI_RUN: ${{ inputs.uefi_run_id }}
        run: |
          set -euo pipefail
          # 镜像 artifact 名由桌面档派生；显式给了名字也必须是这一档的派生命，
          # 防止把 KDE 的树包进 GNOME 的 bundle。
          releasever=$(python3 -c 'import json;print(json.load(open("product.json"))["target"]["releasever"])')
          derived=$(python3 scripts/piano_desktop.py expand --desktop "$DESKTOP" --releasever "$releasever")
          # 这三个 workflow 一次只做一个桌面档；`all` 属于 build-rootfs 的矩阵，
          # 在这里会让派生名悄悄取第一行，所以直接拒绝。
          test "$(python3 -c 'import json,sys;print(len(json.loads(sys.argv[1])))' "$derived")" -eq 1 || {
            echo "desktop '$DESKTOP' expands to more than one entry; name a single desktop" >&2
            exit 2
          }
          expected_image=$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])[0]["image_artifact"])' "$derived")
          ROOT_IMAGE=${ROOT_IMAGE:-$expected_image}
          test "$ROOT_IMAGE" = "$expected_image" || {
            echo "root_image_artifact $ROOT_IMAGE is not the $DESKTOP image ($expected_image)" >&2
            exit 2
          }
          echo "root_image_artifact=$ROOT_IMAGE" >> "$GITHUB_OUTPUT"
          args=()
          if [ -n "$ROOT_RUN" ]; then args+=(--run-id "$ROOT_RUN"); fi
          python3 scripts/resolve-artifact-run.py --workflow build-image.yml --artifact "$ROOT_IMAGE" --output-key root_run "${args[@]}"
          uefi_args=()
          if [ -n "$UEFI_RUN" ]; then uefi_args+=(--run-id "$UEFI_RUN"); fi
          python3 scripts/resolve-artifact-run.py --workflow build-uefi.yml --artifact "$UEFI_ARTIFACT" --output-key uefi_run "${uefi_args[@]}"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.src.outputs.root_image_artifact }}
          path: build/in/image
          run-id: ${{ steps.src.outputs.root_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require one integrated image source record
        env:
          ROOT_RUN: ${{ steps.src.outputs.root_run }}
          DESKTOP: ${{ inputs.desktop }}
        run: |
          set -euo pipefail
          test "$(find build/in/image -maxdepth 1 -type f -name 'source-runs.json' | wc -l)" -eq 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path("build/in/image/source-runs.json").read_text())
          required = ("kernel_run", "rootfs_run", "runtime_run", "mesa_run",
                      "ffmpeg_run", "image_run", "image_source_commit")
          missing = [name for name in required if not record.get(name)]
          assert not missing, f"integrated image record lacks source runs: {missing}"
          assert record["image_run"] == os.environ["ROOT_RUN"], (
              f"image_run {record['image_run']} != resolved build-image run {os.environ['ROOT_RUN']}")
          # 镜像里的桌面档必须与这次 bundle 的输入一致：拿错档位的镜像
          # （例如 KDE 的 root 配 GNOME 的输入）在这里就停下。
          assert record.get("desktop") == os.environ["DESKTOP"], (
              f"image was assembled for desktop {record.get('desktop')!r}, "
              f"not {os.environ['DESKTOP']!r}")
          print("OK: integrated image source runs:", {name: record[name] for name in required})
          PY

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.uefi_artifact }}
          path: build/in/uefi
          run-id: ${{ steps.src.outputs.uefi_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the exact integrated kernel
        id: kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 镜像记录里写明了它消费的内核 artifact；旧记录没有这个字段时默认正式档。
          # 新交付只接受正式内核，拒绝旧实验构建。
          record=build/in/image/source-runs.json
          kernel_artifact=$(python3 -c 'import json;print(json.load(open("'"$record"'")).get("kernel_artifact","kernel-release-7.2.9"))')
          case "$kernel_artifact" in
            kernel-release-7.2.9) ;;
            *) echo "recorded kernel_artifact is not allowed: $kernel_artifact" >&2; exit 2 ;;
          esac
          run=$(python3 -c 'import json;print(json.load(open("'"$record"'"))["kernel_run"])')
          echo "kernel_artifact=$kernel_artifact" >> "$GITHUB_OUTPUT"
          python3 scripts/resolve-artifact-run.py --workflow build-kernel.yml --artifact "$kernel_artifact" --run-id "$run"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.kernel.outputs.kernel_artifact }}
          path: build/in/kernel
          run-id: ${{ steps.kernel.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack the isolated components and verify identity
        env:
          KERNEL_ARTIFACT: ${{ steps.kernel.outputs.kernel_artifact }}
        run: |
          set -euo pipefail
          mkdir -p build/kernel build/uefi build/initramfs build/device-root
          # 精确选择记录里的内核归档。
          tar -I zstd -xf "build/in/kernel/$KERNEL_ARTIFACT.tar.zst" -C build/kernel
          tar -I zstd -xf build/in/uefi/*.tar.zst -C build/uefi
          tar -I zstd -xf build/in/image/initramfs.tar.zst -C build/initramfs
          sudo tar -I zstd --numeric-owner --xattrs --xattrs-include='*' --acls --selinux -xf build/in/image/device-root.tar.zst -C build/device-root
          (cd build/in/image && sha256sum -c image-SHA256SUMS)
          cmp build/kernel/manifest.json build/in/image/kernel-manifest.json
          python3 scripts/checkout-sources.py --output build/sources --mode boot

      - name: Seal the actual UEFI source and project patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UEFI_RUN: ${{ steps.src.outputs.uefi_run }}
        run: |
          set -euo pipefail
          python3 scripts/seal-uefi-source.py --run-id "$UEFI_RUN" \
            --image build/uefi/PianoUEFI-product.img --output build/uefi-source.json

      - name: Read the ESP capacity from product.json
        id: product
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("product.json"))["target"]["esp_size_mib"]
          assert isinstance(value, int) and value > 0, value
          print(f"esp_size_mib={value}")
          PY

      - name: Create the upstream-compatible ESP and Linux boot payload
        env:
          # ESP 容量只在 product.json 定义，这里不写第二份。
          ESP_SIZE_MIB: ${{ steps.product.outputs.esp_size_mib }}
        run: |
          set -euo pipefail
          test -n "$ESP_SIZE_MIB"
          # Ubuntu 24.04 的 libfdt 1.6.1 会覆盖已存在的 panel phandle。
          # 使用锁定上游 1.8.1，sudo 下显式传递工具和动态库路径。
          make -C build/sources/dtc -j2 NO_PYTHON=1 NO_YAML=1 dtc fdtoverlay
          export PATH="$PWD/build/sources/dtc:$PATH"
          export LD_LIBRARY_PATH="$PWD/build/sources/dtc/libfdt"
          PIANO_TEST_SUNUEFI=build/sources/sunuefi python3 tests/check_bundle_overlays.py
          # stock Android BOOT 包装仍要求本机当前 BOOT，通用包不冒充已部署合体 BOOT。
          sudo env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            python3 build/sources/sunuefi/tools/package_release.py \
            --uefi build/uefi/PianoUEFI-product.img --kernel build/kernel \
            --dtb build/sources/sunuefi/vendor/piano-linux/board.dtb \
            --cpu-model-overlay build/sources/sunuefi/linux/dts/piano-cpu-model.dtso \
            --panel-vendor auto \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-board-identity.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-regdma-resource.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-audio-dmic-clock.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-camera-flash.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-camera-privacy-led.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-touch-panel.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-pen-dock.dtso \
            --dtb-overlay build/sources/sunuefi/linux/dts/piano-pen-charger.dtso \
            --initramfs build/initramfs/initramfs.cpio.gz \
            --rootfs build/device-root/rootfs --rootfs-manifest build/device-root/manifest.json \
            --root-selector LABEL=PIANOROOT --esp-size-mib "$ESP_SIZE_MIB" --output build/packaged

      - name: Assemble and verify the delivery set
        env:
          UEFI_RUN: ${{ steps.src.outputs.uefi_run }}
          ROOT_RUN: ${{ steps.src.outputs.root_run }}
          DESKTOP: ${{ inputs.desktop }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          # The deploy-bundle uses the same names as the documented fastboot
          # commands. Keeping generic esp.img/boot.img here forced the
          # installer and manual instructions onto two naming contracts.
          sudo cp build/packaged/esp.img bundle/sunuefi_esp.img
          sudo cp build/packaged/boot.img bundle/boot_sunuefi.img
          sudo cp build/packaged/PianoUEFI-product.img bundle/
          # Retired generic names stay out of the release artifact. If a
          # consumer still reads them, fail here instead of publishing two
          # identities for the same payload.
          test ! -e bundle/esp.img
          test ! -e bundle/boot.img
          cp build/in/image/pianoroot.f2fs.img.zst bundle/
          # 封存镜像与设备容量无关。直接可刷的 sparse 随 bundle 一起发布，
          # 装机不需要再跑 prepare-install 去按本机分区容量重算一份。
          zstd -dc bundle/pianoroot.f2fs.img.zst > build/pianoroot.f2fs.img
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import piano_sparse; \
            piano_sparse.encode('build/pianoroot.f2fs.img', 'bundle/pianoroot.f2fs.sparse.img')"
          rm -f build/pianoroot.f2fs.img
          cp build/in/image/diagnostic-abl-storage.tar.zst bundle/
          # initramfs.tar.zst 由 build-image 用固定时间戳与 owner 打出，四档
          # 逐字节相同，所以它是平台资产。release.yml 的 platform_files 里
          # 一直有它，但以前没人把它拷进 bundle，门禁在 release 那一步才以
          # "deploy-bundle lacks platform asset" 失败。
          cp build/in/image/initramfs.tar.zst bundle/
          cp build/in/image/root-image-manifest.json build/in/image/source-runs.json build/in/image/runtime-manifest.json bundle/
          cp build/in/image/mesa-manifest.json build/in/image/ffmpeg-manifest.json build/in/image/rootfs-manifest.json bundle/
          cp build/kernel/manifest.json bundle/kernel-manifest.json
          cp build/uefi-source.json bundle/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('bundle/source-runs.json')
          record = json.loads(path.read_text())
          record.update(uefi_run=os.environ['UEFI_RUN'], image_run=os.environ['ROOT_RUN'],
                        desktop=os.environ['DESKTOP'],
                        bundle_source_commit=os.environ['GITHUB_SHA'])
          pins = json.loads(Path('sources.lock.json').read_text())['sources']
          record['dtc_commit'] = pins['dtc']['commit']
          record['dt_bindings_commit'] = pins['linux-piano']['commit']
          path.write_text(json.dumps(record, indent=2) + '\n')
          PY
          cp build/initramfs/manifest.json bundle/initramfs-manifest.json
          sudo cp build/packaged/manifest.json bundle/esp-manifest.json
          sudo chown -R "$(id -u):$(id -g)" bundle
          python3 scripts/verify-bundle.py --bundle bundle --write-manifest
          (cd bundle && sha256sum -c SHA256SUMS)
          ls -lh bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
