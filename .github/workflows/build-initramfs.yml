name: build-initramfs

# 从 Fedora rootfs 与内核产物构建 F2FS 根分区用的 initramfs。
#
# 上游的 release-rootfs 绑定 Debian（dpkg-query、/lib/aarch64-linux-gnu、
# ext4 专用挂载），这份实现不依赖发行版包管理器，产出 f2fs 版引导脚本。
#
# 单 job：下载两个 artifact → 构建 → 解包核对 → 上传。不跨 job 搬大文件。
on:
  workflow_dispatch:
    inputs:
      rootfs_artifact:
        description: "完整设备根文件系统 artifact（含 device-root.tar.zst）"
        required: true
        default: "root-image-8192"
      kernel_artifact:
        description: "内核 artifact 名"
        required: true
        default: "kernel-release-7.2.9"
      root_image_run_id:
        description: "固定完整集成镜像 run，留空解析最新成功 run"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  initramfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils cpio zstd python3

      - name: Resolve the complete device root
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT_ARTIFACT: ${{ inputs.rootfs_artifact }}
          ROOT_RUN: ${{ inputs.root_image_run_id }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ROOT_RUN" ]; then args+=(--run-id "$ROOT_RUN"); fi
          python3 scripts/resolve-artifact-run.py --workflow build-image.yml \
            --artifact "$ROOT_ARTIFACT" --output-key rootfs_run "${args[@]}"

      - name: Download rootfs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.rootfs_artifact }}
          path: in/rootfs
          run-id: ${{ steps.src.outputs.rootfs_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the exact device root kernel
        id: kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact }}
        run: |
          set -euo pipefail
          run=$(python3 -c 'import json;print(json.load(open("in/rootfs/source-runs.json"))["kernel_run"])')
          python3 scripts/resolve-artifact-run.py --workflow build-kernel.yml \
            --artifact "$KERNEL_ARTIFACT" --run-id "$run"

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kernel_artifact }}
          path: in/kernel
          run-id: ${{ steps.kernel.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack inputs
        run: |
          set -euo pipefail
          mkdir -p stage/rootfs stage/kernel
          # rootfs 里有 root 拥有的文件，解包需要 root 才能保留权限。
          (cd in/rootfs && sha256sum -c image-SHA256SUMS)
          sudo tar -I zstd --numeric-owner --xattrs --xattrs-include='*' --acls --selinux \
            -xf in/rootfs/device-root.tar.zst -C stage/rootfs
          tar -I zstd -xf in/kernel/*.tar.zst -C stage/kernel
          cmp stage/kernel/manifest.json in/rootfs/kernel-manifest.json
          test -d stage/rootfs/rootfs
          test -f stage/kernel/manifest.json
          sudo du -sh stage/rootfs/rootfs

      - name: Build initramfs
        run: |
          set -euo pipefail
          python3 scripts/build-initramfs.py \
            --rootfs stage/rootfs/rootfs \
            --kernel stage/kernel \
            --output initramfs-out
          cat initramfs-out/manifest.json

      - name: Verify the archive
        run: |
          set -euo pipefail
          cd initramfs-out
          gzip -dc initramfs.cpio.gz > initramfs.cpio
          cpio -it < initramfs.cpio > listing.txt
          for required in init pianoinit bin/busybox bin/sh bin/mount bin/switch_root \
                          bin/insmod etc/piano/root-label etc/piano/root-partname \
                          etc/piano/kernel-release etc/piano/modules-load-order; do
            grep -qx "$required" listing.txt || { echo "::error::$required missing"; exit 1; }
          done
          python3 - <<'PY'
          import json, gzip, sys
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text())
          assert manifest["root_fstype"] == "f2fs", manifest["root_fstype"]
          assert manifest["device_tested"] is False, "must not claim device testing"
          assert manifest["modules"], "empty module closure"
          print("initramfs:", manifest["initramfs_bytes"], "bytes,",
                len(manifest["modules"]), "modules")
          PY
          echo "entry count: $(wc -l < listing.txt)"

      - name: Package
        run: |
          set -euo pipefail
          sudo tar -I 'zstd -10 -T0' -cf initramfs.tar.zst -C initramfs-out .
          sudo chown "$(id -u):$(id -g)" initramfs.tar.zst
          ls -lh initramfs.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: initramfs-f2fs
          path: initramfs.tar.zst
          retention-days: 14
          compression-level: 1
