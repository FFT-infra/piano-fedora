name: prepare-install

# 构建安装材料与真实 F2FS 扩容验证；不连接或写入平板。
on:
  workflow_dispatch:
    inputs:
      bundle_run:
        description: "已成功且完整验证的 deploy-bundle run"
        required: true
        default: ""
      root_size_mib:
        description: "可选：把 root 预先扩到这个 MiB；留空则用封存容量，首启长满分区"
        required: false
        default: ""
      android_slot:
        description: "Android 槽位（首装固定 _a；已有分区更新可用 _b）"
        type: choice
        options: ["_a", "_b"]
        default: "_a"

permissions:
  contents: read
  actions: read

jobs:
  root-capacity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq f2fs-tools zstd attr
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || sudo apt-get install -y -qq linux-modules-extra-azure
          sudo modprobe f2fs
      - name: Free runner disk before the 11 GiB bundle
        run: |
          set -euo pipefail
          # deploy-bundle 解压后约 11.5 GiB，而下载动作会先把 zip 落盘再展开。
          # arm 运行器预装的工具链把这份余量吃掉了，解压就会在中途被截断——
          # 而且是静默的：动作报成功，文件少了一半。
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Validate the exact deploy-bundle run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.bundle_run }}" || {
            echo "bundle_run is required" >&2
            exit 2
          }
          python3 scripts/resolve-artifact-run.py --workflow build-bundle.yml \
            --artifact deploy-bundle --run-id "${{ inputs.bundle_run }}" \
            --output-key bundle_run

      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: build/in/bundle
          run-id: ${{ inputs.bundle_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # 下载动作不保证解压完整，实测会在中途静默停下。这一档必须紧跟在下载
      # 之后：否则要等容量验证跑完二十分钟才看到缺文件。
      - name: Verify the downloaded bundle immediately
        run: (cd build/in/bundle && sha256sum -c SHA256SUMS)
      - name: Verify a real filesystem expansion and sparse roundtrip
        env:
          TMPDIR: ${{ github.workspace }}/build/tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          sudo env TMPDIR="$TMPDIR" python3 tests/check_root_capacity.py --mount
      - name: Prepare and fully verify the selected capacity
        env:
          ROOT_SIZE_MIB: ${{ inputs.root_size_mib }}
          ANDROID_SLOT: ${{ inputs.android_slot }}
          TMPDIR: ${{ github.workspace }}/build/tmp
        run: |
          set -euo pipefail
          sudo env TMPDIR="$TMPDIR" python3 scripts/prepare-root-capacity.py \
            --bundle build/in/bundle ${ROOT_SIZE_MIB:+--size-mib "$ROOT_SIZE_MIB"} \
            --output build/root-install --android-slot "$ANDROID_SLOT"
          sudo chown -R "$(id -u):$(id -g)" build/root-install
          (cd build/root-install && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: root-install
          path: build/root-install/
          if-no-files-found: error
          retention-days: 14
          # 与 deploy-bundle 同理：这里是一份 8 GiB 的 sparse 根镜像。
          compression-level: 6

  boot-tools:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the native and selector toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm git zstd python3
      - name: Free runner disk before the 11 GiB bundle
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Fetch exact boot source dependencies
        run: python3 scripts/checkout-sources.py --output build/installer-sources --mode installer

      - name: Validate the exact deploy-bundle run
        id: bundle_src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.bundle_run }}" || {
            echo "bundle_run is required" >&2
            exit 2
          }
          python3 scripts/resolve-artifact-run.py --workflow build-bundle.yml \
            --artifact deploy-bundle --run-id "${{ inputs.bundle_run }}" \
            --output-key bundle_run

      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: build/in/bundle
          run-id: ${{ steps.bundle_src.outputs.bundle_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the bundle's exact UEFI run
        id: uefi_src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uefi=$(python3 -c 'import json; print(json.load(open("build/in/bundle/source-runs.json"))["uefi_run"])')
          test -n "$uefi"
          python3 scripts/resolve-artifact-run.py --workflow build-uefi.yml \
            --artifact uefi-product --run-id "$uefi" --output-key uefi_run

      - uses: actions/download-artifact@v4
        with:
          name: uefi-product
          path: build/in/uefi
          run-id: ${{ steps.uefi_src.outputs.uefi_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the sealed UEFI core and compile its native tools
        env:
          SUNUEFI_TOOLCHAIN_ROOT: /usr
          TMPDIR: ${{ github.workspace }}/build/tmp
          # 交付目录里不留 __pycache__：它不被 SHA256SUMS 覆盖，且会晚于导出时刻。
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p build/product "$TMPDIR"
          (cd build/in/bundle && sha256sum -c SHA256SUMS)
          tar -I zstd -xf build/in/uefi/uefi-product.tar.zst -C build/product
          cmp build/product/PianoUEFI-product.img build/in/bundle/PianoUEFI-product.img
          python3 scripts/build-boot-tools.py \
            --sunuefi build/installer-sources/sunuefi \
            --product build/product --output build/boot-tools --cc gcc
          python3 build/installer-sources/sunuefi/tools/build_boot_request.py \
            --output build/boot-tools/boot-request --cc gcc
          cp -a build/product build/boot-tools/product
          cp sources.lock.json build/boot-tools/sources.lock.json
          python3 tests/check_installer.py --sunuefi build/installer-sources/sunuefi
          python3 scripts/export-installer.py --sunuefi build/installer-sources/sunuefi --output build/boot-tools/installer
          python3 build/boot-tools/installer/scripts/install-f2fs.py --help
          (cd build/boot-tools/installer && sha256sum -c SHA256SUMS)
          python3 -m unittest discover -s build/installer-sources/sunuefi/tests/unit -p test_boot_request.py -v
      - name: Verify the exported installer is unchanged
        run: |
          set -euo pipefail
          # 导出后、上传前复算一次：摘要之外还要求没有文件晚于 SHA256SUMS 的写入时刻。
          python3 tests/check_installer_export.py build/boot-tools/installer
      - uses: actions/upload-artifact@v4
        with:
          name: boot-tools
          path: build/boot-tools/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  host-boot-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git python3
      - name: Fetch pinned native sources
        run: python3 scripts/checkout-sources.py --output build/host-boot-sources --mode installer
      - name: Build the portable host repacker
        env:
          TMPDIR: ${{ github.workspace }}/build/tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          chmod +x scripts/static-cc.sh
          python3 build/host-boot-sources/sunuefi/tools/build_boot_repack.py \
            --arch host --cc "$GITHUB_WORKSPACE/scripts/static-cc.sh" --output build/host-boot-tool
          file build/host-boot-tool/piano-boot-repack
          build/host-boot-tool/piano-boot-repack status
      - uses: actions/upload-artifact@v4
        with:
          name: host-boot-tool
          path: build/host-boot-tool/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
