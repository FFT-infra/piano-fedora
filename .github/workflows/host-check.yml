name: host-check

# 主机侧检查；显式 dispatch 可附带打包或原生 FFmpeg 构建，不接触设备。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_prepare_run:
        description: "可选：同时压缩该成功 prepare-install run 的材料"
        required: false
        default: ""
      package_desktop:
        description: "package_prepare_run 那一档；root-install artifact 带这个后缀"
        required: false
        default: "gnome"
      build_ffmpeg:
        description: "同时构建锁定 Fedora FFmpeg 与上游 BSP 补丁的原生 RPM"
        required: false
        type: boolean
        default: false
      build_piano_rpms:
        description: "同时构建 Fedora 矩阵 RPM（含匹配的 kernel-piano）"
        required: false
        type: boolean
        default: false
      kernel_run_id:
        description: "build_piano_rpms=true 时必填：已成功的 build-kernel run"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  ffmpeg:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ffmpeg }}
    uses: ./.github/workflows/build-ffmpeg.yml
  package-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_prepare_run != '' }}
    uses: ./.github/workflows/package-install.yml
    with:
      prepare_run: ${{ inputs.package_prepare_run }}
      desktop: ${{ inputs.package_desktop }}
  piano-rpms:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_piano_rpms }}
    uses: ./.github/workflows/build-piano-rpms.yml
    with:
      kernel_run_id: ${{ inputs.kernel_run_id }}
      releasever: "45"
  checks:
    env:
      PIANO_TEST_SUNUEFI: ${{ github.workspace }}/build/test-sources/sunuefi
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Fedora test container runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
      - name: Prepare the pinned source for real staging and patch checks
        run: python3 scripts/checkout-sources.py --output build/test-sources --mode boot
      - name: Run all checks with the actual Fedora bootstrap tools
        run: |
          sudo podman run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            --env PIANO_TEST_SUNUEFI=/workspace/build/test-sources/sunuefi \
            registry.fedoraproject.org/fedora:45 bash -euo pipefail -c '
              dnf -y install busybox binutils util-linux shadow-utils libxcrypt make git python3 gcc patch dtc logrotate glib2-devel f2fs-tools
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/build/test-sources/sunuefi
              git config --global --add safe.directory /workspace/build/test-sources/sunuefi/upstream/debian-piano-current
              make test
            '
      - name: Verify no device-write commands in workflows
        run: |
          set -euo pipefail
          if grep -rniE 'fastboot (flash|erase)|adb (push|shell .*dd)|dd if=.*of=/dev/block' \
               .github/workflows/ --exclude=host-check.yml; then
            echo "FAIL: workflow contains device-write commands" >&2
            exit 1
          fi
          echo "OK: no device-write commands"

  vendor-dt:
    # 厂商 DTS 只作 overlay 的审阅基准，不进任何出货产物。编不过本身就是要修的
    # 信息，所以这一 job 失败不挡其他检查，报告照常上传。
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install DT tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git gcc make flex bison python3
      - name: Fetch the pinned vendor DTS and the SunUEFI overlays
        run: python3 scripts/checkout-sources.py --output build/vendor-dt-src --mode vendor-dt
      - name: Build the pinned dtc and libfdt
        run: make -C build/vendor-dt-src/dtc -j2 NO_PYTHON=1 NO_YAML=1 dtc fdtoverlay
      - name: Compare each overlay against the vendor hardware description
        run: |
          set -euo pipefail
          export PATH="$PWD/build/vendor-dt-src/dtc:$PATH"
          export LD_LIBRARY_PATH="$PWD/build/vendor-dt-src/dtc/libfdt"
          python3 scripts/compare-vendor-dt.py \
            --vendor build/vendor-dt-src/vendor-kernel \
            --sunuefi build/vendor-dt-src/sunuefi \
            --dtc build/vendor-dt-src/dtc \
            --output build/vendor-dt-report
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-dt-report
          path: build/vendor-dt-report

  vendor-blobs:
    # 固件对照同样只出报告：厂商 blob 不进镜像，也不需要在这里下载，
    # 只取索引算 blob 摘要。报告看完再决定要不要升成门禁。
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install git
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3
      - name: Fetch the vendor blob index and the shipped firmware tree
        run: python3 scripts/checkout-sources.py --output build/vendor-blobs-src --mode vendor-blobs
      - name: Compare every shipped firmware file against the vendor copy
        run: |
          set -euo pipefail
          python3 scripts/compare-vendor-blobs.py \
            --vendor-blobs build/vendor-blobs-src/vendor-blobs \
            --firmware build/vendor-blobs-src/sunuefi/upstream/piano-firmware-current/firmware \
            --output build/vendor-blob-report
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-blob-report
          path: build/vendor-blob-report
