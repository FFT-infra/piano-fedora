name: host-check

# 只做主机侧检查，不构建镜像，不接触设备。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_prepare_run:
        description: "可选：同时压缩该成功 prepare-install run 的材料"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  package-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_prepare_run != '' }}
    uses: ./.github/workflows/package-install.yml
    with:
      prepare_run: ${{ inputs.package_prepare_run }}
  checks:
    env:
      PIANO_TEST_SUNUEFI: ${{ github.workspace }}/build/test-sources/sunuefi
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Fedora test container runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
      - name: Prepare the pinned source for real staging and patch checks
        run: python3 scripts/checkout-sources.py --output build/test-sources --mode boot
      - name: Run all checks with the actual Fedora bootstrap tools
        run: |
          sudo podman run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            --env PIANO_TEST_SUNUEFI=/workspace/build/test-sources/sunuefi \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf -y install busybox binutils util-linux shadow-utils libxcrypt make git python3 gcc patch
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/build/test-sources/sunuefi
              git config --global --add safe.directory /workspace/build/test-sources/sunuefi/upstream/debian-piano-current
              make test
            '
      - name: Verify no device-write commands in workflows
        run: |
          set -euo pipefail
          if grep -rniE 'fastboot (flash|erase)|adb (push|shell .*dd)|dd if=.*of=/dev/block' \
               .github/workflows/ --exclude=host-check.yml; then
            echo "FAIL: workflow contains device-write commands" >&2
            exit 1
          fi
          echo "OK: no device-write commands"
