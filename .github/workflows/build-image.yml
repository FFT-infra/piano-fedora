name: build-image

# 同一 job 组装 rootfs、模块/RPM、initramfs 与 F2FS 镜像；产物互相绑定摘要。
on:
  workflow_dispatch:
    inputs:
      rootfs_artifact:
        description: "Fedora 基础树 artifact"
        required: true
        default: "rootfs-44-gnome"
      kernel_artifact:
        description: "正式内核 artifact（内建 Gunyah）：kernel-release-7.2.9"
        required: true
        default: "kernel-release-7.2.9"
      runtime_artifact:
        description: "正式设备 RPM：piano-fedora-runtime，必须匹配内核摘要"
        required: true
        default: "piano-fedora-runtime"
      size_mib:
        description: "测试 root 镜像容量（MiB），不修改设备分区"
        required: false
        default: "8192"
      kernel_run_id:
        description: "固定内核与 SDK 的成功 run（发布构建必填）"
        required: false
        default: ""
      runtime_run_id:
        description: "固定设备运行时的成功 run（发布构建必填）"
        required: false
        default: ""
      rootfs_run_id:
        description: "固定已审计 RootFS 的成功 run（发布构建必填）"
        required: false
        default: ""
      mesa_run_id:
        description: "固定 Mesa 的成功 run（发布构建必填）"
        required: false
        default: ""
      ffmpeg_run_id:
        description: "固定 FFmpeg 的成功 run（发布构建必填）"
        required: false
        default: ""
      release_mode:
        description: "发布构建必须为 true，禁止自动选择最新 artifact"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the image builder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq f2fs-tools attr acl libcap2-bin zstd podman kmod binutils cpp device-tree-compiler lz4 git
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe f2fs
          grep -qw f2fs /proc/filesystems
          fsck.f2fs 2>&1 | sed -n '1,24p' || true

      - name: Resolve successful input runs
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOTFS_ARTIFACT: ${{ inputs.rootfs_artifact }}
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact }}
          RUNTIME_ARTIFACT: ${{ inputs.runtime_artifact }}
          KERNEL_RUN: ${{ inputs.kernel_run_id }}
          RUNTIME_RUN: ${{ inputs.runtime_run_id }}
          ROOTFS_RUN: ${{ inputs.rootfs_run_id }}
          MESA_RUN: ${{ inputs.mesa_run_id }}
          FFMPEG_RUN: ${{ inputs.ffmpeg_run_id }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          # 正式产物统一包含 Gunyah；旧实验产物不进入新交付链。
          test "$KERNEL_ARTIFACT" = kernel-release-7.2.9 || {
            echo "only production kernel-release-7.2.9 is accepted" >&2; exit 2;
          }
          KERNEL_TIER=standard
          EXPECTED_RUNTIME=piano-fedora-runtime
          kernel_artifacts=(--artifact "$KERNEL_ARTIFACT" --artifact kernel-sdk-7.2.9)
          test "$RUNTIME_ARTIFACT" = "$EXPECTED_RUNTIME" || {
            echo "runtime_artifact $RUNTIME_ARTIFACT does not match kernel tier $KERNEL_TIER (expected $EXPECTED_RUNTIME)" >&2
            exit 2
          }
          echo "kernel_tier=$KERNEL_TIER" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_MODE" = true ]; then
            for pair in "rootfs_run_id:$ROOTFS_RUN" "kernel_run_id:$KERNEL_RUN" \
                        "runtime_run_id:$RUNTIME_RUN" "mesa_run_id:$MESA_RUN" \
                        "ffmpeg_run_id:$FFMPEG_RUN"; do
              name=${pair%%:*}; value=${pair#*:}
              test -n "$value" || { echo "$name is required in release_mode" >&2; exit 2; }
            done
          fi
          rootfs_args=(); kernel_args=(); runtime_args=(); mesa_args=(); ffmpeg_args=()
          if [ -n "$ROOTFS_RUN" ]; then rootfs_args+=(--run-id "$ROOTFS_RUN"); fi
          if [ -n "$KERNEL_RUN" ]; then kernel_args+=(--run-id "$KERNEL_RUN"); fi
          if [ -n "$RUNTIME_RUN" ]; then runtime_args+=(--run-id "$RUNTIME_RUN"); fi
          if [ -n "$MESA_RUN" ]; then mesa_args+=(--run-id "$MESA_RUN"); fi
          if [ -n "$FFMPEG_RUN" ]; then ffmpeg_args+=(--run-id "$FFMPEG_RUN"); fi
          python3 scripts/resolve-artifact-run.py --workflow build-rootfs.yml --artifact "$ROOTFS_ARTIFACT" --output-key rootfs_run "${rootfs_args[@]}"
          python3 scripts/resolve-artifact-run.py --workflow build-kernel.yml "${kernel_artifacts[@]}" --output-key kernel_run "${kernel_args[@]}"
          python3 scripts/resolve-artifact-run.py --workflow build-device-runtime.yml --artifact "$RUNTIME_ARTIFACT" --output-key runtime_run "${runtime_args[@]}"
          python3 scripts/resolve-artifact-run.py --workflow build-mesa.yml --artifact piano-fedora-mesa --output-key mesa_run "${mesa_args[@]}"
          # build-ffmpeg.yml 是 workflow_call 复用件，未单独注册；实际 run 的 workflow_id
          # 是 host-check。按已注册的 host-check 解析，artifact 名仍是 piano-fedora-ffmpeg。
          python3 scripts/resolve-artifact-run.py --workflow host-check.yml --artifact piano-fedora-ffmpeg --output-key ffmpeg_run "${ffmpeg_args[@]}"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.rootfs_artifact }}
          path: build/in/base
          run-id: ${{ steps.source.outputs.rootfs_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kernel_artifact }}
          path: build/in/kernel
          run-id: ${{ steps.source.outputs.kernel_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.runtime_artifact }}
          path: build/in/runtime
          run-id: ${{ steps.source.outputs.runtime_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: piano-fedora-mesa
          path: build/in/mesa
          run-id: ${{ steps.source.outputs.mesa_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: piano-fedora-ffmpeg
          path: build/in/ffmpeg
          run-id: ${{ steps.source.outputs.ffmpeg_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack into separate component directories
        env:
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact }}
        run: |
          set -euo pipefail
          mkdir -p build/device-root build/kernel build/runtime build/mesa build/ffmpeg build/image-tmp
          sudo tar -I zstd --numeric-owner --xattrs --xattrs-include='*' --acls --selinux -xf build/in/base/*.tar.zst -C build/device-root
          # 精确选择内核归档，SDK 与运行时仍按独立目录处理。
          # 只解与 kernel_artifact 同名的那个内核 archive。
          tar -I zstd -xf "build/in/kernel/$KERNEL_ARTIFACT.tar.zst" -C build/kernel
          tar -I zstd -xf build/in/runtime/*.tar.zst -C build/runtime
          tar -I zstd -xf build/in/mesa/*.tar.zst -C build/mesa
          tar -I zstd -xf build/in/ffmpeg/*.tar.zst -C build/ffmpeg
          python3 scripts/checkout-sources.py --output build/sources --mode boot

      - name: Require a fully assembled release rootfs
        env:
          KERNEL_RUN: ${{ steps.source.outputs.kernel_run }}
        run: |
          set -euo pipefail
          root=build/device-root/rootfs
          python3 - "$root" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          # rpm refuses a relative --root ("arguments to --root (-r) must
          # begin with a /"). Resolve once and use the absolute path for both
          # rpm queries and the SELinux/config reads.
          root = Path(sys.argv[1]).resolve()
          record = json.loads((root.parent / "clean-manifest.json").read_text())
          assert record["status"] == "BUILT_AND_AUDITED"
          assert record["audit"]["audit_passed"] is True
          local = record.get("local_inputs", {})
          kernel = json.loads(Path("build/kernel/manifest.json").read_text())
          assert local.get("kernel_run") == os.environ["KERNEL_RUN"], (
              "rootfs kernel run differs from the build-image kernel run: "
              f"{local.get('kernel_run')!r} != {os.environ['KERNEL_RUN']!r}")
          assert record["audit"]["kernel_release"] == kernel["kernel_release"], (
              "rootfs kernel release differs from the sealed kernel: "
              f"{record['audit']['kernel_release']!r} != {kernel['kernel_release']!r}")
          assert record["audit"]["selinux_labels"] > 0
          assert not record["audit"]["selinux_problems"]
          config = (root / "etc/selinux/config").read_text()
          mode = next(line.split("=", 1)[1] for line in config.splitlines()
                      if line.startswith("SELINUX="))
          assert mode == "enforcing"
          assert not (root / ".autorelabel").exists()
          modules = root / "usr/lib/modules"
          releases = sorted(p.name for p in modules.iterdir() if p.is_dir()) if modules.is_dir() else []
          assert len(releases) == 1, (
              "the clean rootfs must carry exactly the kernel-piano module "
              f"tree; found {releases}")
          assert not any(p.is_symlink() for p in modules.iterdir()), (
              "the clean rootfs module root must not contain aliases")
          assert (modules / releases[0] / "modules.dep").is_file(), (
              "the clean rootfs kernel-piano tree lacks modules.dep")
          # The rootfs was unpacked with --numeric-owner, so the rpmdb is
          # owned by root and read-only to the runner user. build-clean-rootfs
          # runs its audit as root for the same reason; do the same here, and
          # print the database state so an empty read is diagnosable.
          db_dir = root / "usr/lib/sysimage/rpm"
          print("rpmdb:", sorted(p.name for p in db_dir.iterdir())[:8] if db_dir.is_dir() else "missing")
          installed = subprocess.check_output(
              ["sudo", "rpm", "--root", str(root), "-qa"],
              text=True, stderr=subprocess.STDOUT).splitlines()
          print("rpm -qa count:", len(installed))
          names = {line.rsplit("-", 2)[0] for line in installed}
          required = {
              "piano-fedora-configs", "alsa-xiaomi-piano", "xiaomi-piano-firmware",
              "piano-camera", "xiaomi-piano-thp", "sm8750-video-accel",
              "uperf-linux", "libssc", "iio-sensor-proxy-ssc",
              "piano-runtime", "librevm", "piano-crosvm", "libva-v4l2-iris",
              "mesa-dri-drivers", "ffmpeg-free", "kernel-piano",
          }
          missing = sorted(required - names)
          assert not missing, f"rootfs lacks release packages: {missing}"
          owner = subprocess.check_output(
              ["sudo", "rpm", "--root", str(root), "-qf",
               f"/usr/lib/modules/{releases[0]}/modules.dep"], text=True).strip()
          assert owner.rsplit("-", 2)[0] == "kernel-piano", owner
          print("OK: rootfs was assembled in one audited installroot and "
                "kernel-piano owns the module tree")
          PY

      - name: Reject a base rootfs without the GNOME session bus
        run: |
          set -euo pipefail
          root=build/device-root/rootfs
          python3 - "$root" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          # rpm refuses a relative --root ("arguments to --root (-r) must
          # begin with a /"). Resolve once and use the absolute path for both
          # rpm queries and the SELinux/config reads.
          root = Path(sys.argv[1]).resolve()
          record = json.loads((root.parent / "clean-manifest.json").read_text())
          audit = record["audit"]
          assert record["status"] == "BUILT_AND_AUDITED"
          assert audit["audit_passed"] is True
          installed = subprocess.check_output(
              ["sudo", "rpm", "--root", str(root), "-qa"], text=True).splitlines()
          names = {line.rsplit("-", 2)[0] for line in installed}
          for package in ("dbus-daemon", "systemd-pam"):
              assert package in names, package
          for path in ("usr/bin/dbus-daemon", "usr/bin/dbus-run-session",
                       "usr/lib64/security/pam_systemd.so"):
              assert (root / path).exists(), path
          print("OK: base rootfs carries the GNOME session bus")
          PY

      - name: Validate and stage the sealed kernel payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          kernel_hash = hashlib.sha256(Path('build/kernel/manifest.json').read_bytes()).hexdigest()
          runtime = json.loads(Path('build/runtime/manifest.json').read_text())
          assert runtime['kernel_manifest_sha256'] == kernel_hash, 'runtime/kernel mismatch'
          for component in ('runtime', 'mesa', 'ffmpeg'):
              manifest = json.loads(Path(f'build/{component}/manifest.json').read_text())
              for name, item in manifest['rpms'].items():
                  p = Path(f'build/{component}/rpms') / name
                  assert p.is_file() and p.stat().st_size == item['bytes']
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == item['sha256'], name
          PY
          sudo python3 scripts/stage-rootfs-payload.py --rootfs build/device-root/rootfs --kernel build/kernel --sunuefi build/sources/sunuefi
          sudo python3 scripts/apply-rootfs-policy.py --rootfs build/device-root/rootfs

      - name: Finalize services and the rootfs identity
        run: |
          set -euo pipefail
          sudo python3 scripts/finalize-fedora-rootfs.py --rootfs build/device-root/rootfs \
            --kernel build/kernel --runtime build/runtime --mesa build/mesa \
            --ffmpeg build/ffmpeg --output build/device-root
          sudo python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'build/sources/sunuefi/tools')
          import package_release
          release = json.loads(Path('build/kernel/manifest.json').read_text())['kernel_release']
          rows = package_release.scan_root(Path('build/device-root/rootfs').resolve(), release)
          print('OK: upstream package root preflight:', len(rows), 'entries')
          PY
          release=$(python3 -c 'import json; print(json.load(open("product.json"))["target"]["releasever"])')
          sudo podman run --rm --privileged -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "registry.fedoraproject.org/fedora:$release" bash -euo pipefail -c '
              dnf -y install policycoreutils
              root=/workspace/build/device-root/rootfs
              setfiles -F -r "$root" "$root/etc/selinux/targeted/contexts/files/file_contexts" "$root"
            '

      - name: Build the matching initramfs
        run: |
          set -euo pipefail
          sudo python3 scripts/build-initramfs.py --rootfs build/device-root/rootfs --kernel build/kernel --output build/initramfs
          cat build/initramfs/manifest.json

      - name: Build the isolated upstream ABL storage diagnostic
        run: |
          set -euo pipefail
          headers=build/sources/sunuefi/upstream/linux-piano
          git init -q "$headers"
          kernel_url=$(python3 -c 'import json;print(json.load(open("sources.lock.json"))["sources"]["linux-piano"]["url"])')
          kernel_commit=$(python3 -c 'import json;print(json.load(open("sources.lock.json"))["sources"]["linux-piano"]["commit"])')
          git -C "$headers" remote set-url origin "$kernel_url" 2>/dev/null || git -C "$headers" remote add origin "$kernel_url"
          git -C "$headers" sparse-checkout set --cone include/dt-bindings include/uapi
          git -C "$headers" fetch --depth=1 --filter=blob:none origin "$kernel_commit"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$kernel_commit"
          source=build/sources/sunuefi/upstream/debian-piano-current
          # 上游脚本按同级 linux-piano/include 取头文件；gitlink 名不同，用明确包装目录。
          mkdir -p build/abl-source-layout
          ln -s "$GITHUB_WORKSPACE/$source" build/abl-source-layout/debian-piano
          ln -s "$GITHUB_WORKSPACE/$headers" build/abl-source-layout/linux-piano
          # build() 接收显式 repo 路径，不改上游脚本或 checkout。
          PIANO_ABL_SOURCE="$source" python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          source = Path(os.environ['PIANO_ABL_SOURCE'])
          spec = importlib.util.spec_from_file_location('pinned_dtbo', source / 'scripts/build-dtbo.py')
          tool = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tool)
          tool.build(Path('build/abl-source-layout/debian-piano'),
                     source / 'boot/dtbo-piano-power.dts', Path('build/dtbo-abl-storage.img'), 'dtc')
          PY
          python3 scripts/build-initramfs.py --rootfs build/device-root/rootfs \
            --kernel build/kernel --output build/initramfs-abl --boot-chain abl-storage --abl-source "$source"
          python3 scripts/build-abl-diagnostic.py --kernel build/kernel \
            --initramfs build/initramfs-abl --source "$source" \
            --dtbo build/dtbo-abl-storage.img --output build/diagnostic-abl-storage
          sudo tar -I 'zstd -6 -T0' -cf diagnostic-abl-storage.tar.zst -C build/diagnostic-abl-storage .
          sudo chown "$(id -u):$(id -g)" diagnostic-abl-storage.tar.zst

      - name: Build and fully verify the F2FS image
        env:
          ROOT_SIZE: ${{ inputs.size_mib }}
        run: |
          set -euo pipefail
          sudo env TMPDIR="$GITHUB_WORKSPACE/build/image-tmp" python3 scripts/build-f2fs-image.py \
            --rootfs build/device-root/rootfs --size-mib "$ROOT_SIZE" \
            --output pianoroot.f2fs.img --verify --manifest root-image-manifest.json
          sudo python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('root-image-manifest.json')
          m = json.loads(p.read_text())
          for name, folder in (('rootfs', 'device-root'), ('kernel', 'kernel'),
                               ('runtime', 'runtime'), ('mesa', 'mesa'),
                               ('ffmpeg', 'ffmpeg'), ('initramfs', 'initramfs')):
              m[name + '_manifest_sha256'] = hashlib.sha256(Path(f'build/{folder}/manifest.json').read_bytes()).hexdigest()
          p.write_text(json.dumps(m, indent=2) + '\n')
          PY
          cat root-image-manifest.json
          zstd -10 -T0 -o pianoroot.f2fs.img.zst pianoroot.f2fs.img

      - name: Package the same staged root and initramfs
        env:
          KERNEL_RUN: ${{ steps.source.outputs.kernel_run }}
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact }}
          ROOTFS_RUN: ${{ steps.source.outputs.rootfs_run }}
          RUNTIME_RUN: ${{ steps.source.outputs.runtime_run }}
          MESA_RUN: ${{ steps.source.outputs.mesa_run }}
          FFMPEG_RUN: ${{ steps.source.outputs.ffmpeg_run }}
        run: |
          set -euo pipefail
          sudo tar --format=pax --numeric-owner --xattrs --xattrs-include='*' --acls --selinux \
            -I 'zstd -6 -T0' -cf device-root.tar.zst -C build/device-root rootfs manifest.json packages.tsv
          tar -I 'zstd -6 -T0' -cf initramfs.tar.zst -C build/initramfs .
          cp build/kernel/manifest.json kernel-manifest.json
          cp build/runtime/manifest.json runtime-manifest.json
          cp build/mesa/manifest.json mesa-manifest.json
          cp build/ffmpeg/manifest.json ffmpeg-manifest.json
          sudo cp build/device-root/manifest.json rootfs-manifest.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('source-runs.json').write_text(json.dumps({
              'kernel_run': os.environ['KERNEL_RUN'], 'rootfs_run': os.environ['ROOTFS_RUN'],
              'kernel_artifact': os.environ['KERNEL_ARTIFACT'],
              'runtime_run': os.environ['RUNTIME_RUN'], 'mesa_run': os.environ['MESA_RUN'],
              'ffmpeg_run': os.environ['FFMPEG_RUN'],
              'image_run': os.environ['GITHUB_RUN_ID'],
              'image_source_commit': os.environ['GITHUB_SHA']}, indent=2) + '\n')
          PY
          sudo chown "$(id -u):$(id -g)" device-root.tar.zst root-image-manifest.json
          sha256sum pianoroot.f2fs.img.zst device-root.tar.zst initramfs.tar.zst diagnostic-abl-storage.tar.zst > image-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: root-image-${{ inputs.size_mib }}
          path: |
            pianoroot.f2fs.img.zst
            root-image-manifest.json
            device-root.tar.zst
            initramfs.tar.zst
            diagnostic-abl-storage.tar.zst
            kernel-manifest.json
            runtime-manifest.json
            mesa-manifest.json
            ffmpeg-manifest.json
            rootfs-manifest.json
            image-SHA256SUMS
            source-runs.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
