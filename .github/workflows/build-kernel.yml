name: build-kernel

# 按 sources.lock.json 取 SunUEFI，构建 piano 内核 Image、DTB 与模块。
#
# 上游 build.sh linux 会走 prepare_release_kernel + build_piano_full_kernel，
# 约 2.5 小时。这里只跑内核，不碰 UEFI、Mesa、Sensors 和 rootfs。
#
# 不接触设备。
on:
  workflow_dispatch:
    inputs:
      sunuefi_ref:
        description: "SunUEFI ref（留空则用 sources.lock.json 的 commit）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  kernel:
    # 原生 arm64：内核交叉编译在 x86 上也能做，但原生更快，且与上游一致。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      # 上游 tools/build_piano_full_kernel.py 只在 CCACHE_DIR 存在时才把编译器
      # 换成 "ccache clang" 并固定 KBUILD_BUILD_TIMESTAMP。只安装 ccache 不设
      # 这个变量等于没装：每次都走裸 clang 全量重编。
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned commits
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("sources.lock.json"))["sources"]
          print("sunuefi_url=" + lock["sunuefi"]["url"])
          print("sunuefi_commit=" + lock["sunuefi"]["commit"])
          print("kernel_url=" + lock["linux-piano"]["url"])
          print("kernel_commit=" + lock["linux-piano"]["commit"])
          PY
          cat "$GITHUB_OUTPUT"

      - name: Install kernel build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm make bison flex bc \
            libssl-dev libelf-dev cpio zstd xz-utils \
            python3 python3-venv git rsync ccache device-tree-compiler kmod
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip make bison flex bc; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Restore the compiler cache
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # 恢复 key 带上内核输入：pin、补丁和工作流引用的准备脚本。改了其中
          # 任何一项就换新 key，restore-keys 再退回上一份缓存，仍然命中大部分。
          key: kernel-ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json', 'patches/**', 'scripts/apply-patches.py', 'scripts/prepare-production-kernel.py') }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Reset the compiler cache statistics
        run: ccache -z

      - name: Clone SunUEFI at the pinned commit
        run: |
          set -euo pipefail
          REF="${{ inputs.sunuefi_ref }}"
          [ -n "$REF" ] || REF="${{ steps.pins.outputs.sunuefi_commit }}"
          git clone --filter=blob:none "${{ steps.pins.outputs.sunuefi_url }}" sunuefi
          git -C sunuefi checkout "$REF"
          echo "sunuefi at $(git -C sunuefi rev-parse HEAD)"

      - name: Clone kernel at the pinned commit
        run: |
          set -euo pipefail
          mkdir -p sunuefi/upstream
          git clone --filter=blob:none "${{ steps.pins.outputs.kernel_url }}" sunuefi/upstream/linux-piano
          git -C sunuefi/upstream/linux-piano checkout "${{ steps.pins.outputs.kernel_commit }}"
          echo "kernel at $(git -C sunuefi/upstream/linux-piano rev-parse HEAD)"

      - name: Apply project patches to SunUEFI
        run: |
          set -euo pipefail
          # 上游按 commit 锁定，改动走本仓库补丁。补丁自带目标文件摘要，
          # 上游一变就报错退出，不静默套用一个上下文已变的补丁。
          python3 scripts/apply-patches.py --sunuefi sunuefi

      - name: Prepare the release kernel source
        run: python3 scripts/prepare-production-kernel.py --sunuefi sunuefi

      - name: Report a failed source preparation
        if: failure()
        working-directory: sunuefi
        run: |
          set -euo pipefail
          # 准备失败时把记录打出来：派生树摘要不在本地算得出来，只能从这里的
          # actual_tree 取回再回填 prepare_release_kernel.py。
          for f in build/kernel-worktrees/*.failure.json; do
            if [ -f "$f" ]; then
              echo "== $f"
              cat "$f"
            fi
          done

      - name: Validate the complete Fedora configuration before compilation
        working-directory: sunuefi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          record = json.loads(Path('build/release/production-source-manifest.json').read_text())
          subprocess.run([
              'python3', 'tools/build_piano_full_kernel.py',
              '--worktree', record['worktree'], '--commit', record['actual_commit'],
              '--root', 'LABEL=PIANOROOT', '--root-fstype', 'f2fs', '--fedora-policy',
              '--configure-only', '--rebuild',
              '--build-dir', 'build/kernels/release',
              '--artifacts', 'artifacts/kernels/release',
          ], check=True)
          config = Path('build/kernels/release/.config').read_text().splitlines()
          required = {
              # Root filesystem and policy: the image cannot boot without them.
              'F2FS_FS': 'y', 'F2FS_FS_XATTR': 'y', 'F2FS_FS_POSIX_ACL': 'y',
              'F2FS_FS_SECURITY': 'y', 'SECURITY_NETWORK': 'y', 'SECURITY_SELINUX': 'y',
              'GUNYAH': 'y', 'GUNYAH_HYPERCALLS': 'y', 'GUNYAH_TIMER': 'y',
              'GUNYAH_PLATFORM_HOOKS': 'y', 'GUNYAH_QCOM_PLATFORM': 'y',
              'GUNYAH_QCOM_TRUSTED_VM': 'y', 'GUNYAH_IRQFD': 'y', 'GUNYAH_IOEVENTFD': 'y',
              # Hardware the desktop depends on. LIRC and IR_SPI have silently
              # dropped out of the configuration before; the rest are the same
              # kind of platform-fragment default that can regress unnoticed.
              'LIRC': 'y', 'IR_SPI': 'm', 'SND_SEQUENCER': 'm',
              'ARM64_PIANO_OPTIMIZE': 'y', 'LEDS_CLASS_FLASH': 'm',
              'UIO_PIANO_FINGERPRINT': 'm',
          }
          for name, value in required.items():
              assert 'CONFIG_' + name + '=' + value in config, (name, value)
          assert 'CONFIG_LSM="selinux"' in config
          assert any('rootfstype=f2fs' in line for line in config if line.startswith('CONFIG_CMDLINE='))
          print('Fedora F2FS/SELinux configuration verified before the long build')
          PY


      - name: Build kernel
        working-directory: sunuefi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          record = json.loads(Path('build/release/production-source-manifest.json').read_text())
          subprocess.run([
              'python3', 'tools/build_piano_full_kernel.py',
              '--worktree', record['worktree'],
              '--commit', record['actual_commit'],
              '--root', 'LABEL=PIANOROOT',
              '--root-fstype', 'f2fs', '--fedora-policy',
              '--rebuild',
              '--build-dir', 'build/kernels/release',
              '--artifacts', 'artifacts/kernels/release',
          ], check=True)
          PY

      - name: Inspect kernel artifacts
        working-directory: sunuefi
        run: |
          set -euo pipefail
          test -d artifacts/kernels/release
          ls -lh artifacts/kernels/release
          cat artifacts/kernels/release/manifest.json 2>/dev/null || true

      - name: Export the matching module build inputs
        working-directory: sunuefi
        run: |
          set -euo pipefail
          # SDK 用于同一内核的外部模块和 native helper 构建，不重新编一套 ABI。
          OUT=build/kernels/release
          test -s "$OUT/Module.symvers"
          test -s "$OUT/.config"
          tar -I 'zstd -6 -T0' -cf "$GITHUB_WORKSPACE/kernel-sdk-7.3.0.tar.zst" \
            -C "$OUT" .config Module.symvers include/config include/generated \
            arch/arm64/include/generated
          cp build/release/production-source-manifest.json "$GITHUB_WORKSPACE/kernel-source-manifest.json"
          cp artifacts/kernels/release/manifest.json "$GITHUB_WORKSPACE/kernel-sdk-manifest.json"

      - name: Package kernel
        working-directory: sunuefi
        run: |
          set -euo pipefail
          tar -I 'zstd -10 -T0' -cf "$GITHUB_WORKSPACE/kernel-release-7.3.0.tar.zst" \
            -C artifacts/kernels/release .
          ls -lh "$GITHUB_WORKSPACE"/kernel-release-7.3.0.tar.zst

      - name: Report the compiler cache
        if: always()
        run: ccache --show-stats || true

      # 命中已有缓存时不再保存：key 相同，重复保存只会多传一份。
      - name: Save the compiler cache
        if: ${{ always() && steps.kernel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-release-7.3.0
          path: kernel-release-7.3.0.tar.zst
          retention-days: 14
          compression-level: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-sdk-7.3.0
          path: |
            kernel-sdk-7.3.0.tar.zst
            kernel-source-manifest.json
            kernel-sdk-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
