name: build-kernel

# 按 sources.lock.json 取 SunUEFI，构建 piano 内核 Image、DTB 与模块。
#
# 上游 build.sh linux 会走 prepare_release_kernel + build_piano_full_kernel，
# 约 2.5 小时。这里只跑内核，不碰 UEFI、Mesa、Sensors 和 rootfs。
#
# 不接触设备。
on:
  workflow_dispatch:
    inputs:
      sunuefi_ref:
        description: "SunUEFI ref（留空则用 sources.lock.json 的 commit）"
        required: false
        default: ""
      experimental_kernel_run_id:
        description: "实验 Gunyah 内核：复用哪次成功的内核 run 作为封存输入；留空则只构建正式档"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  kernel:
    # 指定实验 run 时只跑实验档；正式档与实验档不同时构建，避免白跑一遍长构建。
    if: inputs.experimental_kernel_run_id == ''
    # 原生 arm64：内核交叉编译在 x86 上也能做，但原生更快，且与上游一致。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned commits
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("sources.lock.json"))["sources"]
          print("sunuefi_url=" + lock["sunuefi"]["url"])
          print("sunuefi_commit=" + lock["sunuefi"]["commit"])
          print("kernel_url=" + lock["linux-piano"]["url"])
          print("kernel_commit=" + lock["linux-piano"]["commit"])
          PY
          cat "$GITHUB_OUTPUT"

      - name: Install kernel build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm make bison flex bc \
            libssl-dev libelf-dev cpio zstd xz-utils \
            python3 python3-venv git rsync ccache device-tree-compiler kmod
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip make bison flex bc; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Clone SunUEFI at the pinned commit
        run: |
          set -euo pipefail
          REF="${{ inputs.sunuefi_ref }}"
          [ -n "$REF" ] || REF="${{ steps.pins.outputs.sunuefi_commit }}"
          git clone --filter=blob:none "${{ steps.pins.outputs.sunuefi_url }}" sunuefi
          git -C sunuefi checkout "$REF"
          echo "sunuefi at $(git -C sunuefi rev-parse HEAD)"

      - name: Clone kernel at the pinned commit
        run: |
          set -euo pipefail
          mkdir -p sunuefi/upstream
          git clone --filter=blob:none "${{ steps.pins.outputs.kernel_url }}" sunuefi/upstream/linux-piano
          git -C sunuefi/upstream/linux-piano checkout "${{ steps.pins.outputs.kernel_commit }}"
          echo "kernel at $(git -C sunuefi/upstream/linux-piano rev-parse HEAD)"

      - name: Apply project patches to SunUEFI
        run: |
          set -euo pipefail
          # 上游按 commit 锁定，改动走本仓库补丁。补丁自带目标文件摘要，
          # 上游一变就报错退出，不静默套用一个上下文已变的补丁。
          python3 scripts/apply-patches.py --sunuefi sunuefi

      - name: Prepare release kernel
        working-directory: sunuefi
        run: python3 tools/prepare_release_kernel.py --refresh

      - name: Validate the complete Fedora configuration before compilation
        working-directory: sunuefi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          record = json.loads(Path('build/release-7.2.9/source-manifest.json').read_text())
          subprocess.run([
              'python3', 'tools/build_piano_full_kernel.py',
              '--worktree', record['worktree'], '--commit', record['actual_commit'],
              '--root', 'LABEL=PIANOROOT', '--root-fstype', 'f2fs', '--fedora-policy',
              '--configure-only', '--rebuild',
              '--build-dir', 'build/kernels/release-7.2.9',
              '--artifacts', 'artifacts/kernels/release-7.2.9',
          ], check=True)
          config = Path('build/kernels/release-7.2.9/.config').read_text().splitlines()
          for name in ('F2FS_FS', 'F2FS_FS_XATTR', 'F2FS_FS_POSIX_ACL',
                       'F2FS_FS_SECURITY', 'SECURITY_NETWORK', 'SECURITY_SELINUX'):
              assert 'CONFIG_' + name + '=y' in config, name
          assert 'CONFIG_LSM="selinux"' in config
          assert any('rootfstype=f2fs' in line for line in config if line.startswith('CONFIG_CMDLINE='))
          print('Fedora F2FS/SELinux configuration verified before the long build')
          PY

      - name: Build kernel
        working-directory: sunuefi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          record = json.loads(Path('build/release-7.2.9/source-manifest.json').read_text())
          subprocess.run([
              'python3', 'tools/build_piano_full_kernel.py',
              '--worktree', record['worktree'],
              '--commit', record['actual_commit'],
              '--root', 'LABEL=PIANOROOT',
              '--root-fstype', 'f2fs', '--fedora-policy',
              '--rebuild',
              '--build-dir', 'build/kernels/release-7.2.9',
              '--artifacts', 'artifacts/kernels/release-7.2.9',
          ], check=True)
          PY

      - name: Inspect kernel artifacts
        working-directory: sunuefi
        run: |
          set -euo pipefail
          test -d artifacts/kernels/release-7.2.9
          ls -lh artifacts/kernels/release-7.2.9
          cat artifacts/kernels/release-7.2.9/manifest.json 2>/dev/null || true

      - name: Export the matching module build inputs
        working-directory: sunuefi
        run: |
          set -euo pipefail
          # SDK 用于同一内核的外部模块和 native helper 构建，不重新编一套 ABI。
          OUT=build/kernels/release-7.2.9
          test -s "$OUT/Module.symvers"
          test -s "$OUT/.config"
          tar -I 'zstd -6 -T0' -cf "$GITHUB_WORKSPACE/kernel-sdk-7.2.9.tar.zst" \
            -C "$OUT" .config Module.symvers include/config include/generated \
            arch/arm64/include/generated
          cp build/release-7.2.9/source-manifest.json "$GITHUB_WORKSPACE/kernel-source-manifest.json"
          cp artifacts/kernels/release-7.2.9/manifest.json "$GITHUB_WORKSPACE/kernel-sdk-manifest.json"

      - name: Package kernel
        working-directory: sunuefi
        run: |
          set -euo pipefail
          tar -I 'zstd -10 -T0' -cf "$GITHUB_WORKSPACE/kernel-release-7.2.9.tar.zst" \
            -C artifacts/kernels/release-7.2.9 .
          ls -lh "$GITHUB_WORKSPACE"/kernel-release-7.2.9.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-release-7.2.9
          path: kernel-release-7.2.9.tar.zst
          retention-days: 14
          compression-level: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-sdk-7.2.9
          path: |
            kernel-sdk-7.2.9.tar.zst
            kernel-source-manifest.json
            kernel-sdk-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # 实验档：把官方厂商内核里的 Gunyah VMM 子集导入我们内核源码的独立派生树，
  # 用显式的 --experimental-gunyah 配置单独构建一份。正式内核与其 pin 不受影响；
  # 派生树是新 worktree 的 detached HEAD，输入 checkout 不被修改。
  # 需要一次成功的内核 run 作为封存输入（--kernel 要的是已构建产物）。
  gunyah-kernel:
    if: inputs.experimental_kernel_run_id != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned commits
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("sources.lock.json"))["sources"]
          print("sunuefi_url=" + lock["sunuefi"]["url"])
          print("sunuefi_commit=" + lock["sunuefi"]["commit"])
          print("kernel_url=" + lock["linux-piano"]["url"])
          print("kernel_commit=" + lock["linux-piano"]["commit"])
          PY

      - name: Download the sealed kernel inputs from the selected run
        uses: actions/download-artifact@v4
        with:
          name: kernel-release-7.2.9
          run-id: ${{ inputs.experimental_kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sealed

      - name: Install kernel build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm make bison flex bc \
            libssl-dev libelf-dev cpio zstd xz-utils \
            python3 python3-venv git rsync ccache device-tree-compiler kmod
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip make bison flex bc; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Clone SunUEFI at the pinned commit
        run: |
          set -euo pipefail
          git clone --filter=blob:none "${{ steps.pins.outputs.sunuefi_url }}" sunuefi
          git -C sunuefi checkout "${{ steps.pins.outputs.sunuefi_commit }}"
          echo "sunuefi at $(git -C sunuefi rev-parse HEAD)"

      - name: Clone kernel and pinned vendor kernel
        run: |
          set -euo pipefail
          mkdir -p sunuefi/upstream
          git clone --filter=blob:none "${{ steps.pins.outputs.kernel_url }}" sunuefi/upstream/linux-piano
          git -C sunuefi/upstream/linux-piano checkout "${{ steps.pins.outputs.kernel_commit }}"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          entry = json.loads(Path('sources.lock.json').read_text())['sources']['piano-vendor-kernel']
          target = Path('sunuefi/upstream/piano-vendor-kernel')
          subprocess.run(['git', 'clone', '--filter=blob:none', entry['url'], str(target)], check=True)
          subprocess.run(['git', '-C', str(target), 'checkout', entry['commit']], check=True)
          PY

      - name: Apply project patches to SunUEFI
        run: python3 scripts/apply-patches.py --sunuefi sunuefi

      - name: Prepare the release kernel source
        working-directory: sunuefi
        run: python3 tools/prepare_release_kernel.py --refresh

      - name: Derive the Gunyah experiment worktree
        run: |
          set -euo pipefail
          mkdir -p sealed/artifacts
          tar -I zstd -xf sealed/kernel-release-7.2.9.tar.zst -C sealed/artifacts
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          record = json.loads(Path('sunuefi/build/release-7.2.9/source-manifest.json').read_text())
          subprocess.run([
              'python3', 'scripts/prepare-gunyah-source.py',
              '--kernel', 'sealed/artifacts',
              '--kernel-source', record['worktree'],
              '--vendor', 'sunuefi/upstream/piano-vendor-kernel',
              '--output', 'build/kernel-worktrees/gunyah-experiment', '--execute',
          ], check=True)
          PY

      - name: Preflight the Gunyah driver objects
        working-directory: sunuefi
        run: |
          set -euo pipefail
          # 厂商驱动是 6.6.57 基线，导入 7.2 内核后有 API 漂移。先只配置、再单编
          # Gunyah 目录，让漂移在十分钟内暴露，而不是等整核编到第 51 分钟。
          # 参数与下面的整核构建一致；配置结果会被下一步重新生成。
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          manifest = json.loads((workspace / 'build/kernel-worktrees/gunyah-experiment.manifest.json').read_text())
          assert manifest['status'] == 'PREPARED_NOT_BUILT_NOT_DEVICE_VERIFIED', manifest['status']
          subprocess.run([
              'python3', 'tools/build_piano_full_kernel.py',
              '--worktree', str(workspace / 'build/kernel-worktrees/gunyah-experiment'),
              '--commit', manifest['derived']['commit'],
              '--root', 'LABEL=PIANOROOT', '--root-fstype', 'f2fs',
              '--fedora-policy', '--experimental-gunyah',
              '--rebuild',
              '--build-dir', 'build/kernels/experimental-gunyah',
              '--artifacts', 'artifacts/kernels/experimental-gunyah',
              '--configure-only',
          ], check=True)
          PY
          OUT=build/kernels/experimental-gunyah
          WT=$(python3 -c "import json;print(json.load(open('$OUT/full-build-pending.json'))['compiler_worktree'])")
          test -d "$WT"
          make -C "$WT" O="$PWD/$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 -j4 \
            drivers/virt/gunyah/ arch/arm64/gunyah/

      - name: Build the experimental Gunyah kernel
        working-directory: sunuefi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          manifest = json.loads((workspace / 'build/kernel-worktrees/gunyah-experiment.manifest.json').read_text())
          assert manifest['status'] == 'PREPARED_NOT_BUILT_NOT_DEVICE_VERIFIED', manifest['status']
          subprocess.run([
              'python3', 'tools/build_piano_full_kernel.py',
              '--worktree', str(workspace / 'build/kernel-worktrees/gunyah-experiment'),
              '--commit', manifest['derived']['commit'],
              '--root', 'LABEL=PIANOROOT', '--root-fstype', 'f2fs',
              '--fedora-policy', '--experimental-gunyah',
              '--rebuild',
              '--build-dir', 'build/kernels/experimental-gunyah',
              '--artifacts', 'artifacts/kernels/experimental-gunyah',
          ], check=True)
          PY

      - name: Export the matching module build inputs
        working-directory: sunuefi
        run: |
          set -euo pipefail
          # 真机侧要用同一内核的 SDK 重建配套 initramfs（换掉归档里的早期模块），
          # 否则 vermagic 不匹配、initramfs 挂不上根。与正式档导出同样的路径集合。
          OUT=build/kernels/experimental-gunyah
          test -s "$OUT/Module.symvers"
          test -s "$OUT/.config"
          tar -I 'zstd -6 -T0' -cf "$GITHUB_WORKSPACE/kernel-experimental-gunyah-sdk.tar.zst" \
            -C "$OUT" .config Module.symvers include/config include/generated \
            arch/arm64/include/generated

      - name: Package the experimental kernel
        working-directory: sunuefi
        run: |
          set -euo pipefail
          tar -I 'zstd -10 -T0' -cf "$GITHUB_WORKSPACE/kernel-experimental-gunyah.tar.zst" \
            -C artifacts/kernels/experimental-gunyah .
          cp "$GITHUB_WORKSPACE/build/kernel-worktrees/gunyah-experiment.manifest.json" \
             "$GITHUB_WORKSPACE/kernel-experimental-gunyah-source.json"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-experimental-gunyah
          path: |
            kernel-experimental-gunyah.tar.zst
            kernel-experimental-gunyah-sdk.tar.zst
            kernel-experimental-gunyah-source.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
