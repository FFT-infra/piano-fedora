name: upstream-watch

# 每周只读核验登记上游的锁定 ref 指向哪个提交，把漂移写进一个跟踪 issue。
# 白名单里的纯用户态上游在 issue 里给出可直接复制的改 pin 命令；
# 内核、UEFI、相机/触控、固件和 debian-piano 只报告，pin 由人评审。
# 本 workflow 不改 sources.lock.json，也不开 PR。
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑审计与报告，不动 issue"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# 两个看板同时写 issue 会互相覆盖，串行执行。
concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Audit the locked upstream refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/audit-upstreams.py --execute || rc=$?
          # 审计对未核验的仓库返回 1；那仍是可报告的结果，不是这一步的失败。
          if [ ! -f build/upstream-audit.json ]; then
            exit "${rc:-1}"
          fi
          [ "$rc" -eq 0 ] || echo "::warning::部分上游未能核验，报告里单独列出"

      - name: Render the drift report
        run: |
          set -euo pipefail
          python3 scripts/upstream-watch.py report \
            --output build/upstream-drift.md \
            --summary build/upstream-drift.json
          cat build/upstream-drift.md

      # 重编包盯的是 Fedora 稳定库版本，不是 git ref。巡检单独出一段，追加到
      # 同一份报告；取不到时记 warning，不把「查不到」当成「没有漂移」。
      - name: Check Fedora overlay baseline drift
        run: |
          set -euo pipefail
          python3 scripts/check_fedora_overlay_releases.py \
            --output build/fedora-overlay-releases.json \
            --report build/fedora-overlay-report.md || \
            echo "::warning::Fedora 重编包巡检失败，报告里单独列出"
          # 巡检自己的失败也要能进报告，避免静默跳过。
          if [ ! -f build/fedora-overlay-report.md ]; then
            printf '## Fedora 重编包巡检\n\n本次未能完成，检查上面的 warning。\n' \
              > build/fedora-overlay-report.md
          fi
          printf '\n' >> build/upstream-drift.md
          cat build/fedora-overlay-report.md >> build/upstream-drift.md
          jq -s '.[0] + {fedora_overlays: .[1]}' \
            build/upstream-drift.json build/fedora-overlay-releases.json \
            > build/upstream-drift.combined.json
          mv build/upstream-drift.combined.json build/upstream-drift.json

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-audit
          path: |
            build/upstream-audit.json
            build/upstream-drift.md
            build/upstream-drift.json
            build/fedora-overlay-releases.json
            build/fedora-overlay-report.md

      - name: Update the tracking issue
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create upstream-drift --color FBCA04 \
            --description "锁定的上游 ref 已离开 pin" || true
          number=$(gh issue list --label upstream-drift --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          drift=$(jq -r '.drift | length' build/upstream-drift.json)
          overlays=$(jq -r '.fedora_overlays.moved | length' build/upstream-drift.json)
          total=$((drift + overlays))
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file build/upstream-drift.md
            if [ "$total" -eq 0 ]; then
              gh issue close "$number" \
                --comment "锁定 ref 与 pin 一致，Fedora 重编包也没有版本漂移，先关掉；下次漂移会重新开一个。"
            fi
          elif [ "$total" -gt 0 ]; then
            gh issue create --label upstream-drift \
              --title "上游漂移：$drift 个锁定 ref 已移动，$overlays 个重编包版本待评估" \
              --body-file build/upstream-drift.md
          else
            echo "没有漂移，不建 issue"
          fi
