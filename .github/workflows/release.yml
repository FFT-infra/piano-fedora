name: release

# 发布只接受已完成的构建，不重新编译任何东西：每档一个 build-bundle 的
# deploy-bundle-<desktop> 与一个 prepare-install 的 root-install-<desktop>，
# 全部绑定到 tag 指向的同一个 commit。
#
# 每档打成一个自包含归档 `piano-<tag>-<desktop>.tar.zst`，超过 2 GiB 时按
# GitHub 的单文件上限切成 `.part-NN`。平台镜像与这一档的 root 都在归档里，
# 用户只下自己那一档：合并分片、解开归档，目录就是安装指南的暂存目录。
#
# 不填 desktop_runs 时每档的 run 都按 tag commit 自动解析。手动给
# `desktop_runs` 只用于某个档位缺 run 时单独发其余档。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在、且指向当前提交的发布 tag"
        required: true
      desktop_runs:
        description: "可选：gnome=<bundle_run>:<prepare_run>,kde=...,niri（不带 = 表示按 commit 解析）；留空则全部档位自动解析"
        required: false
        default: ""
      desktop:
        description: "只发一档时的桌面档；要发全部档位用 all"
        required: false
        default: "all"
      bundle_run:
        description: "只发一档时：build-bundle 成功 run；留空则按 tag commit 解析"
        required: false
        default: ""
      prepare_run:
        description: "只发一档时：prepare-install 成功 run；留空则按 tag commit 解析"
        required: false
        default: ""
      publish:
        description: "转成公开 Release。默认 false，跑完停在 draft"
        required: false
        default: "false"
      prerelease:
        description: "公开时标为 pre-release"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    # 四档时每档都要下载 6-8 GiB 的 bundle 与 root-install，再压缩 2-3 GiB
    # 的归档。单档原来 240 分钟，GitHub 的单 job 上限是 360。
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd coreutils

      - name: Resolve the tag and its desktop runs
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DESKTOP_RUNS: ${{ inputs.desktop_runs }}
          INPUT_DESKTOP: ${{ inputs.desktop }}
          INPUT_BUNDLE_RUN: ${{ inputs.bundle_run }}
          INPUT_PREPARE_RUN: ${{ inputs.prepare_run }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          test -n "$tag" || { echo "tag is required" >&2; exit 2; }
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          sha=$(git rev-parse "refs/tags/${tag}^{commit}")
          test "$sha" = "$(git rev-parse HEAD)" || {
            echo "tag ${tag} points at ${sha}, but this run checked out $(git rev-parse HEAD)" >&2
            echo "dispatch this workflow at the tag commit" >&2
            exit 2
          }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=${sha}" >> "$GITHUB_OUTPUT"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "STAGE=${GITHUB_WORKSPACE}/build/stage" >> "$GITHUB_ENV"
          mkdir -p build/stage
          # 每档的 run 都重新走一遍 artifact 身份、成功状态与提交绑定校验；
          # 桌面名、重复项与占位档的拒绝在 release-desktops.py 里，有离线测试。
          if ! python3 scripts/release-desktops.py \
              --desktop-runs "$INPUT_DESKTOP_RUNS" \
              --desktop "$INPUT_DESKTOP" \
              --bundle-run "$INPUT_BUNDLE_RUN" \
              --prepare-run "$INPUT_PREPARE_RUN" \
              --commit "$sha" --output build/release-plan.json; then
            echo "no usable desktop run set: every desktop needs a successful" >&2
            echo "build-bundle and prepare-install run at ${sha}" >&2
            exit 1
          fi
          desktops=$(python3 -c 'import json; print(" ".join(row["desktop"] for row in json.load(open("build/release-plan.json"))))')
          test -n "$desktops"
          echo "desktops=${desktops}" >> "$GITHUB_OUTPUT"
          echo "DESKTOPS=${desktops}" >> "$GITHUB_ENV"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; delete the draft or release before retrying" >&2
            exit 2
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 说明里的示例用实际发布的第一个档位，单档发布时不会教用户下 gnome。
          example=${DESKTOPS%% *}
          cat > build/stage/notes.md <<EOF
          ## piano Fedora 44 ${TAG}

          - 源码提交: [${GITHUB_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - 档位: ${DESKTOPS}
          - 产物状态: Actions 内完整校验通过；真机验证记录见 [docs/known-issues.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/known-issues.md)

          ### 怎么装

          刷写会解锁 Bootloader、改写 GPT、替换 `boot_a` 的合体 BOOT，并重写
          Linux 分区。先备份全部数据。`current-slot` 必须是 `a`。不要擦除
          `dtbo_a` 或 `dtbo_b`。完整前提见 docs/installation.md。

          每个档位一个归档。只下载自己那一档的归档，别的档不用下。以 ${example} 为例：

          1. 下载 \`piano-${TAG}-${example}.sha256\`，再下载
             \`piano-${TAG}-${example}.tar.zst\` 的全部分片。有这个档位的
             \`.part-00\` 与 \`.part-01\` 时，两个都要。
          2. \`sha256sum -c piano-${TAG}-${example}.sha256\`
          3. \`cat piano-${TAG}-${example}.tar.zst.part-* | zstd -dc | tar -x\`
             只有一个分片时改用 \`zstd -dc piano-${TAG}-${example}.tar.zst | tar -x\`。
          4. \`sha256sum -c SHA256SUMS\` 与 \`(cd root-install && sha256sum -c SHA256SUMS)\`
          5. \`./make-device-boot.sh\` 生成这台的 \`device-boot/boot_linux.img\`
          6. 全新平板先读 docs/installation.md 第四节，再按 \`README-INSTALL.txt\` 刷写。

          也可以让仓库里的 \`scripts/unpack-release.sh\` 代做第 1 至 4 步：
          \`bash scripts/unpack-release.sh --tag ${TAG} --desktop ${example}\`。

          归档里有平台镜像（ESP、Linux 载荷、产品固件）、这一档的
          \`root-install/\`、组件 manifest、一键脚本与 boot-tools。
          \`SHA256SUMS\` 只列归档里真实存在的文件，所以上面两条校验命令都能直接过。
          \`device-boot/boot_linux.img\` 不在归档里。这个文件必须用这台平板自己的
          原厂 BOOT 生成，工具随归档发布。

          Windows 上用 7-Zip 解 \`.tar.zst\`。有分片时先用 \`copy /b\` 合并，再解压。

          校验构建来源: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`
          EOF
          # 默认 draft：转公开要显式传 publish=true。
          gh release create "$TAG" --draft --title "piano Fedora 44 ${TAG}" \
            --notes-file build/stage/notes.md

      - name: Assemble one self-contained archive per desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . scripts/release-upload.sh
          printf '' > "$STAGE/RELEASE-SHA256SUMS"

          for desktop in $DESKTOPS; do
            bundle_run=$(release_plan_value "$desktop" bundle_run)
            prepare_run=$(release_plan_value "$desktop" prepare_run)

            # bundle 与 root 不能同时留在盘上：单个 8 GiB 镜像两份就撑爆 runner。
            rm -rf build/in/bundle build/in/root-install build/in/tools build/archive
            gh run download "$bundle_run" -R "$GITHUB_REPOSITORY" \
              --name "deploy-bundle-${desktop}" --dir build/in/bundle
            (cd build/in/bundle && sha256sum -c SHA256SUMS)
            python3 scripts/verify-bundle.py --bundle build/in/bundle
            # bundle 里只允许出现成员表认识的文件。多出一个说明上游改了产物，
            # 这里必须失败，不能悄悄漏发。
            python3 scripts/release-assets.py check-bundle build/in/bundle

            gh run download "$prepare_run" -R "$GITHUB_REPOSITORY" \
              --name "root-install-${desktop}" --dir build/in/root-install
            (cd build/in/root-install && sha256sum -c SHA256SUMS)

            # 这一档的 root-install 必须来自它自己的 bundle 与 root 镜像。
            python3 - "$desktop" <<'PYEOF'
          import hashlib, json, sys
          from pathlib import Path
          desktop = sys.argv[1]
          bundle = Path("build/in/bundle")
          root = Path("build/in/root-install")
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          record = json.loads((root / "root-install-manifest.json").read_text())
          assert record.get("desktop") == desktop, (
              f"root-install was prepared for desktop {record.get('desktop')!r}, not {desktop!r}")
          assert record["source_bundle_manifest_sha256"] == sha(bundle / "bundle-manifest.json"), (
              f"{desktop}: root-install was prepared from another deploy-bundle")
          assert record["source_root_manifest_sha256"] == sha(bundle / "root-image-manifest.json"), (
              f"{desktop}: root-install was prepared from another root image")
          assert record["android_slot"] == "_a", (
              f"{desktop}: root-install targets Android slot {record['android_slot']}; "
              "the public release ships _a")
          print(f"OK: {desktop} root-install binds to its own bundle")
          PYEOF

            # 引导工具按 pin 的源码构建，四档共用。只在第一档下载一次，留在
            # build/reference/tools 里给后面各档复用；每档仍与它逐字节比对
            # 产品镜像，不一致就停下，不能悄悄挑一份发布。
            if [ ! -d build/reference/tools ]; then
              mkdir -p build/reference/tools
              gh run download "$prepare_run" -R "$GITHUB_REPOSITORY" \
                --name boot-tools --dir build/in/tools/boot-tools
              gh run download "$prepare_run" -R "$GITHUB_REPOSITORY" \
                --name host-boot-tool --dir build/in/tools/host-boot-tool
              (cd build/in/tools/boot-tools/installer && sha256sum -c SHA256SUMS)
              python3 - <<'PYEOF'
          import json
          from pathlib import Path
          host = json.loads(Path("build/in/tools/host-boot-tool/manifest.json").read_text())
          native = json.loads(Path("build/in/tools/boot-tools/native/manifest.json").read_text())
          assert host["sources"] == native["sources"] and host.get("arch") == "host", (
              "host and Android repackers were built from different sources")
          print("OK: host and Android boot tools share one source pin")
          PYEOF
              mv build/in/tools/boot-tools build/in/tools/host-boot-tool build/reference/tools/
            fi
            cmp build/reference/tools/boot-tools/product/PianoUEFI-product.img \
              build/in/bundle/PianoUEFI-product.img

            # 装配归档。平台镜像、组件 manifest 与这一档的 root 都在里面，
            # 用户不需要再从别处拼第二个目录。
            archive="build/archive"
            mkdir -p "$archive/root-install" "$archive/scripts"
            mapfile -t bundled < <(python3 scripts/release-assets.py bundled)
            for name in "${bundled[@]}"; do
              cp -p "build/in/bundle/$name" "$archive/$name"
            done
            cp -p build/in/root-install/pianoroot.f2fs.sparse.img \
                  build/in/root-install/root-install-manifest.json \
                  build/in/root-install/SHA256SUMS "$archive/root-install/"
            cp -a build/reference/tools/boot-tools build/reference/tools/host-boot-tool "$archive/"
            cp scripts/prepare-device-boot.py scripts/piano_artifacts.py scripts/piano_sparse.py \
              "$archive/scripts/"
            cp scripts/installer/flash-linux.sh scripts/installer/flash-linux.bat \
              scripts/installer/README-INSTALL.txt scripts/make-device-boot.sh "$archive/"
            chmod +x "$archive/flash-linux.sh" "$archive/make-device-boot.sh"
            # 归档自己的清单只列目录里真有的文件。留一份列着未发布文件的清单，
            # 手动路径的 `sha256sum -c SHA256SUMS` 就会恒返回 1。
            python3 scripts/release-assets.py write-sums "$archive"

            name=$(python3 scripts/release-assets.py archive-name "$TAG" "$desktop")
            tar -C "$archive" --sort=name --mtime=@0 --owner=0 --group=0 \
              --numeric-owner -cf - . | zstd -10 -T0 --no-progress -o "$STAGE/$name"
            # 压缩必须可逆：解开的字节要与装配目录逐项相同，否则用户下完
            # 才发现清单对不上。
            mkdir -p build/verify
            tar -I zstd -xf "$STAGE/$name" -C build/verify
            diff -r "$archive" build/verify
            rm -rf build/verify "$archive"

            # 单文件就列它自己，切片就列每个分片：这一档的 sidecar 能直接喂给
            # `sha256sum -c`，不需要再下一份覆盖全档的清单。
            release_upload_split "$STAGE/$name" "$name"
            sidecar=$(python3 scripts/release-assets.py sidecar-name "$TAG" "$desktop")
            awk -v want="$name" '$2 == want || $2 ~ "^" want "\\.part-[0-9]+$"' \
              "$STAGE/RELEASE-SHA256SUMS" > "$STAGE/$sidecar"
            test -s "$STAGE/$sidecar" || {
              echo "no uploaded piece matches $name" >&2
              exit 2
            }
            gh release upload "$TAG" "$STAGE/$sidecar"
            # sidecar 由上面的清单切出来，所以只能在切完之后再记它自己的摘要。
            # 它能进总清单，是因为 attestation 只按总清单列出的文件建 subject。
            release_record "$STAGE/$sidecar" "$sidecar"
            rm -rf build/in/bundle build/in/root-install
          done

      - name: Upload the release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sort -k2 "$STAGE/RELEASE-SHA256SUMS" -o "$STAGE/RELEASE-SHA256SUMS"
          gh release upload "$TAG" "$STAGE/RELEASE-SHA256SUMS"

      - name: Fill in the per-desktop table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > build/stage/notes-table.md
          for desktop in $DESKTOPS; do
            name=$(python3 scripts/release-assets.py archive-name "$TAG" "$desktop")
            sidecar=$(python3 scripts/release-assets.py sidecar-name "$TAG" "$desktop")
            parts=$(wc -l < "$STAGE/$sidecar")
            total=$(gh release view "$TAG" --json assets \
              --jq "[.assets[] | select(.name | startswith(\"${name}\")) | .size] | add")
            echo "| \`${desktop}\` | \`${name}\` | ${parts} | $((total / 1048576)) MiB |" \
              >> build/stage/notes-table.md
          done
          {
            echo ""
            echo "### 各档文件"
            echo ""
            echo "| 档位 | 归档 | 分片数 | 下载量 |"
            echo "| --- | --- | --- | --- |"
            cat build/stage/notes-table.md
          } >> build/stage/notes.md
          gh release edit "$TAG" --notes-file build/stage/notes.md

      - name: Attest the published assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: build/stage/RELEASE-SHA256SUMS

      - name: Publish the release
        if: inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$PRERELEASE" = "true" ]; then
            extra+=(--prerelease)
          fi
          gh release edit "$TAG" --draft=false "${extra[@]}"
          gh release view "$TAG" --json url,assets,isDraft,isPrerelease \
            --jq '{url: .url, draft: .isDraft, prerelease: .isPrerelease,
                   assets: [.assets[] | {name, size}]}'

      - name: Leave the release as a draft
        if: inputs.publish != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "publish 未开启，${TAG} 保持 draft。" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url,isDraft \
            --jq '"draft=\(.isDraft) url=\(.url)"'
