name: release

# 发布只接受已完成的构建，不重新编译任何东西：每档一个 build-bundle 的
# deploy-bundle-<desktop> 与一个 prepare-install 的 root-install-<desktop>，
# 全部绑定到 tag 指向的同一个 commit。
#
# 每档打成一个自包含归档 `piano-<tag>-<desktop>.tar.zst`，超过 2 GiB 时按
# GitHub 的单文件上限切成 `.part-NN`。平台镜像与这一档的 root 都在归档里，
# 用户只下自己那一档：合并分片、解开归档，目录就是安装指南的暂存目录。
#
# 任务拆成四段：plan 解析 tag 与各档 run 并建 draft；tools 只下载一次引导
# 工具；archive 按桌面档并行装配、压缩、上传；finalize 汇总校验和、补说明
# 表、做 attestation 并按 publish 输入决定公开或留在 draft。并行只改变调度，
# 每一档的绑定校验与原来逐条相同。
#
# 不填 desktop_runs 时每档的 run 都按 tag commit 自动解析。手动给
# `desktop_runs` 只用于某个档位缺 run 时单独发其余档。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在、且指向当前提交的发布 tag"
        required: true
      desktop_runs:
        description: "可选：gnome=<bundle_run>:<prepare_run>,kde=...,niri（不带 = 表示按 commit 解析）；留空则全部档位自动解析"
        required: false
        default: ""
      desktop:
        description: "只发一档时的桌面档；要发全部档位用 all"
        required: false
        default: "all"
      bundle_run:
        description: "只发一档时：build-bundle 成功 run；留空则按 tag commit 解析"
        required: false
        default: ""
      prepare_run:
        description: "只发一档时：prepare-install 成功 run；留空则按 tag commit 解析"
        required: false
        default: ""
      extras_run:
        description: "可选：build-piano-extras 成功 run；填了才发布 extras-<tag>.tar.zst"
        required: false
        default: ""
      publish:
        description: "转成公开 Release。默认 false，跑完停在 draft"
        required: false
        default: "false"
      prerelease:
        description: "公开时标为 pre-release"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.src.outputs.tag }}
      commit: ${{ steps.src.outputs.commit }}
      desktops: ${{ steps.src.outputs.desktops_json }}
      # JSON 给 matrix 用，空格分隔的给 shell 循环用；两者不能互相顶替。
      desktop_names: ${{ steps.src.outputs.desktops }}
      tools_prepare_run: ${{ steps.src.outputs.tools_prepare_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd coreutils

      - name: Resolve the tag and its desktop runs
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DESKTOP_RUNS: ${{ inputs.desktop_runs }}
          INPUT_DESKTOP: ${{ inputs.desktop }}
          INPUT_BUNDLE_RUN: ${{ inputs.bundle_run }}
          INPUT_PREPARE_RUN: ${{ inputs.prepare_run }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          test -n "$tag" || { echo "tag is required" >&2; exit 2; }
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          sha=$(git rev-parse "refs/tags/${tag}^{commit}")
          test "$sha" = "$(git rev-parse HEAD)" || {
            echo "tag ${tag} points at ${sha}, but this run checked out $(git rev-parse HEAD)" >&2
            echo "dispatch this workflow at the tag commit" >&2
            exit 2
          }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=${sha}" >> "$GITHUB_OUTPUT"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "STAGE=${GITHUB_WORKSPACE}/build/stage" >> "$GITHUB_ENV"
          mkdir -p build/stage
          # 每档的 run 都重新走一遍 artifact 身份、成功状态与提交绑定校验；
          # 桌面名、重复项与占位档的拒绝在 release-desktops.py 里，有离线测试。
          if ! python3 scripts/release-desktops.py \
              --desktop-runs "$INPUT_DESKTOP_RUNS" \
              --desktop "$INPUT_DESKTOP" \
              --bundle-run "$INPUT_BUNDLE_RUN" \
              --prepare-run "$INPUT_PREPARE_RUN" \
              --commit "$sha" --output build/release-plan.json; then
            echo "no usable desktop run set: every desktop needs a successful" >&2
            echo "build-bundle and prepare-install run at ${sha}" >&2
            exit 1
          fi
          desktops=$(python3 -c 'import json; print(" ".join(row["desktop"] for row in json.load(open("build/release-plan.json"))))')
          test -n "$desktops"
          echo "desktops=${desktops}" >> "$GITHUB_OUTPUT"
          echo "desktops_json=$(python3 -c 'import json; print(json.dumps([row["desktop"] for row in json.load(open("build/release-plan.json"))]))')" >> "$GITHUB_OUTPUT"
          # 引导工具四档共用，取计划里第一档的 prepare run 下载一次。
          echo "tools_prepare_run=$(python3 -c 'import json; print(json.load(open("build/release-plan.json"))[0]["prepare_run"])')" >> "$GITHUB_OUTPUT"
          echo "DESKTOPS=${desktops}" >> "$GITHUB_ENV"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; delete the draft or release before retrying" >&2
            exit 2
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 说明里的示例用实际发布的第一个档位，单档发布时不会教用户下 gnome。
          example=${DESKTOPS%% *}
          release=$(python3 -c 'import json; print(json.load(open("product.json"))["target"]["releasever"])')
          cat > build/stage/notes.md <<EOF
          ## piano Fedora ${release} ${TAG}

          小米平板 8 Pro（25091RP04C）的 Fedora 系统。本次发布档位：${DESKTOPS}。各档共用同一个内核与启动链，只有 root 文件系统不同，下载你选的那一档就够。

          - 外设逐项状态见 [README 硬件支持](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md#硬件支持)，已知问题与未验证项见 [docs/known-issues.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/known-issues.md)
          - 产物状态: Actions 内完整校验通过
          - 源码提交: [${GITHUB_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - 启动链: [Project SunUEFI](https://github.com/slwyts/Project-SunUEFI)，文件级许可与第三方材料见该仓库的 LICENSE.md 与 THIRD_PARTY.md；本项目的归属说明见 [NOTICE](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/NOTICE)

          ### 各档文件与选档

          <!-- DESKTOP_TABLE_PLACEHOLDER -->

          ### 新装与在用升级

          - **已有系统升级**：不用重新下载刷机包。终端运行 \`sudo dnf upgrade --refresh\`，内核与适配包从 COPR 更新。步骤见 [docs/upgrade.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/upgrade.md)。
          - **全新安装**：按下面的步骤下载校验，再按 [docs/installation.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/installation.md) 刷写。装完开机直接进桌面，用户名 \`piano\`，默认密码 \`piano123456\`，登录后用 \`passwd\` 改掉。

          刷写会解锁 Bootloader、改写 GPT、替换活动槽合体 BOOT 并重写 Linux 分区，动手前备份全盘数据。**不要擦除 \`dtbo_a\` 或 \`dtbo_b\`**：高通 ABL 校验空 DTBO 会拒绝启动，机器停在 Fastboot。

          每个档位一个自包含归档，只需下载所选档位。以 ${example} 为例：

          1. 下载 \`piano-${TAG}-${example}.sha256\`，再下载
             \`piano-${TAG}-${example}.tar.zst\` 的全部分片。有这个档位的
             \`.part-00\` 与 \`.part-01\` 时，两个都要。
          2. \`sha256sum -c piano-${TAG}-${example}.sha256\`
          3. \`cat piano-${TAG}-${example}.tar.zst.part-* | zstd -dc | tar -x\`
             只有一个分片时改用 \`zstd -dc piano-${TAG}-${example}.tar.zst | tar -x\`。
          4. \`sha256sum -c SHA256SUMS\` 与 \`(cd root-install && sha256sum -c SHA256SUMS)\`
          5. \`./make-device-boot.sh\` 生成这台的 \`device-boot/boot_linux.img\`
          6. 全新平板先读 [docs/installation.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/installation.md) 第四节，再按 \`README-INSTALL.txt\` 刷写。

          也可以让仓库里的 \`scripts/unpack-release.sh\` 代做第 1 至 4 步：
          \`bash scripts/unpack-release.sh --tag ${TAG} --desktop ${example}\`。

          ### 归档内容与安全约束

          - 归档里有平台镜像（ESP、Linux 载荷、产品固件）、这一档的 \`root-install/\`、组件 manifest、一键脚本与 boot-tools。\`SHA256SUMS\` 只列归档里真实存在的文件，所以上面两条校验命令都能直接过。
          - \`device-boot/boot_linux.img\` 不在归档里。这个文件必须用这台平板自己的原厂 BOOT 生成，工具随归档发布。
          - Windows 上用 7-Zip 解 \`.tar.zst\`。有分片时先用 \`copy /b\` 合并，再解压。
          - 校验构建来源: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`
          EOF
          # 默认 draft：转公开要显式传 publish=true。
          gh release create "$TAG" --draft --title "piano Fedora ${release} ${TAG}" \
            --notes-file build/stage/notes.md

      # 后续各档并行取计划，不靠 job 输出字符串再拆一遍。
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: build/release-plan.json
          if-no-files-found: error
          retention-days: 7

  tools:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Download the shared boot tools once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build/in/tools/boot-tools build/in/tools/host-boot-tool
          gh run download "${{ needs.plan.outputs.tools_prepare_run }}" -R "$GITHUB_REPOSITORY" \
            --name boot-tools --dir build/in/tools/boot-tools
          gh run download "${{ needs.plan.outputs.tools_prepare_run }}" -R "$GITHUB_REPOSITORY" \
            --name host-boot-tool --dir build/in/tools/host-boot-tool
          (cd build/in/tools/boot-tools/installer && sha256sum -c SHA256SUMS)
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          host = json.loads(Path("build/in/tools/host-boot-tool/manifest.json").read_text())
          native = json.loads(Path("build/in/tools/boot-tools/native/manifest.json").read_text())
          assert host["sources"] == native["sources"] and host.get("arch") == "host", (
              "host and Android repackers were built from different sources")
          print("OK: host and Android boot tools share one source pin")
          PYEOF
          mkdir -p build/reference/tools
          mv build/in/tools/boot-tools build/in/tools/host-boot-tool build/reference/tools/

      - uses: actions/upload-artifact@v4
        with:
          name: release-boot-tools
          path: build/reference/tools
          if-no-files-found: error
          retention-days: 7

  archive:
    needs: [plan, tools]
    runs-on: ubuntu-24.04-arm
    # 每档一个 job：下载 6-8 GiB 的 bundle 与 root-install，再压缩并解压核对
    # 2-3 GiB 的归档。四档并行，单档 240 分钟足够。
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(needs.plan.outputs.desktops) }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      STAGE: ${{ github.workspace }}/build/stage
      DESKTOP: ${{ matrix.desktop }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd coreutils

      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: release-boot-tools
          path: build/reference/tools

      - name: Assemble this desktop's self-contained archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . scripts/release-upload.sh
          desktop="$DESKTOP"
          mkdir -p "$STAGE"
          printf '' > "$STAGE/RELEASE-SHA256SUMS"
          bundle_run=$(release_plan_value "$desktop" bundle_run)
          prepare_run=$(release_plan_value "$desktop" prepare_run)

          # bundle 与 root 不能同时留在盘上：单个 8 GiB 镜像两份就撑爆 runner。
          rm -rf build/in/bundle build/in/root-install build/archive
          gh run download "$bundle_run" -R "$GITHUB_REPOSITORY" \
            --name "deploy-bundle-${desktop}" --dir build/in/bundle
          (cd build/in/bundle && sha256sum -c SHA256SUMS)
          python3 scripts/verify-bundle.py --bundle build/in/bundle
          # bundle 里只允许出现成员表认识的文件。多出一个说明上游改了产物，
          # 这里必须失败，不能悄悄漏发。
          python3 scripts/release-assets.py check-bundle build/in/bundle

          gh run download "$prepare_run" -R "$GITHUB_REPOSITORY" \
            --name "root-install-${desktop}" --dir build/in/root-install
          (cd build/in/root-install && sha256sum -c SHA256SUMS)

          # 这一档的 root-install 必须来自它自己的 bundle 与 root 镜像。
          python3 - "$desktop" <<'PYEOF'
          import hashlib, json, sys
          from pathlib import Path
          desktop = sys.argv[1]
          bundle = Path("build/in/bundle")
          root = Path("build/in/root-install")
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          record = json.loads((root / "root-install-manifest.json").read_text())
          assert record.get("desktop") == desktop, (
              f"root-install was prepared for desktop {record.get('desktop')!r}, not {desktop!r}")
          assert record["source_bundle_manifest_sha256"] == sha(bundle / "bundle-manifest.json"), (
              f"{desktop}: root-install was prepared from another deploy-bundle")
          assert record["source_root_manifest_sha256"] == sha(bundle / "root-image-manifest.json"), (
              f"{desktop}: root-install was prepared from another root image")
          assert record["android_slot"] == "_a", (
              f"{desktop}: root-install targets Android slot {record['android_slot']}; "
              "the public release ships _a")
          print(f"OK: {desktop} root-install binds to its own bundle")
          PYEOF

          # 引导工具按 pin 的源码构建，四档共用；tools job 只下载一次，各档
          # 从这里取同一份。每档仍与它逐字节比对产品镜像，不一致就停下，
          # 不能悄悄挑一份发布。
          cmp build/reference/tools/boot-tools/product/PianoUEFI-product.img \
            build/in/bundle/PianoUEFI-product.img

          # 装配归档。平台镜像、组件 manifest 与这一档的 root 都在里面，
          # 用户不需要再从别处拼第二个目录。
          archive="build/archive"
          mkdir -p "$archive/root-install" "$archive/scripts"
          mapfile -t bundled < <(python3 scripts/release-assets.py bundled)
          for name in "${bundled[@]}"; do
            cp -p "build/in/bundle/$name" "$archive/$name"
          done
          cp -p build/in/root-install/pianoroot.f2fs.sparse.img \
                build/in/root-install/root-install-manifest.json \
                build/in/root-install/SHA256SUMS "$archive/root-install/"
          cp -a build/reference/tools/boot-tools build/reference/tools/host-boot-tool "$archive/"
          cp scripts/prepare-device-boot.py scripts/piano_artifacts.py scripts/piano_sparse.py \
            "$archive/scripts/"
          cp scripts/installer/flash-linux.sh scripts/installer/flash-linux.bat \
            scripts/installer/README-INSTALL.txt scripts/make-device-boot.sh "$archive/"
          chmod +x "$archive/flash-linux.sh" "$archive/make-device-boot.sh"
          # 归档自己的清单只列目录里真有的文件。留一份列着未发布文件的清单，
          # 手动路径的 `sha256sum -c SHA256SUMS` 就会恒返回 1。
          python3 scripts/release-assets.py write-sums "$archive"

          name=$(python3 scripts/release-assets.py archive-name "$TAG" "$desktop")
          tar -C "$archive" --sort=name --mtime=@0 --owner=0 --group=0 \
            --numeric-owner -cf - . | zstd -10 -T0 --no-progress -o "$STAGE/$name"
          # 压缩必须可逆：解开的字节要与装配目录逐项相同，否则用户下完
          # 才发现清单对不上。
          mkdir -p build/verify
          tar -I zstd -xf "$STAGE/$name" -C build/verify
          diff -r "$archive" build/verify
          rm -rf build/verify "$archive"

          # 单文件就列它自己，切片就列每个分片：这一档的 sidecar 能直接喂给
          # `sha256sum -c`，不需要再下一份覆盖全档的清单。
          release_upload_split "$STAGE/$name" "$name"
          sidecar=$(python3 scripts/release-assets.py sidecar-name "$TAG" "$desktop")
          awk -v want="$name" '$2 == want || $2 ~ "^" want "\\.part-[0-9]+$"' \
            "$STAGE/RELEASE-SHA256SUMS" > "$STAGE/$sidecar"
          test -s "$STAGE/$sidecar" || {
            echo "no uploaded piece matches $name" >&2
            exit 2
          }
          gh release upload "$TAG" "$STAGE/$sidecar"
          # sidecar 由上面的清单切出来，所以只能在切完之后再记它自己的摘要。
          # 它能进总清单，是因为 attestation 只按总清单列出的文件建 subject。
          release_record "$STAGE/$sidecar" "$sidecar"
          rm -rf build/in/bundle build/in/root-install

      # 总校验和在 finalize 汇总；每档只交自己那份。
      - uses: actions/upload-artifact@v4
        with:
          name: release-sums-${{ matrix.desktop }}
          path: build/stage/RELEASE-SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  extras:
    needs: plan
    if: ${{ inputs.extras_run != '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      STAGE: ${{ github.workspace }}/build/stage
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd coreutils

      - name: Add the optional extras archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRAS_RUN: ${{ inputs.extras_run }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          . scripts/release-upload.sh
          mkdir -p "$STAGE"
          printf '' > "$STAGE/RELEASE-SHA256SUMS"
          run_id=$(python3 scripts/resolve-artifact-run.py \
            --workflow build-piano-extras.yml \
            --artifact piano-extras \
            --run-id "$EXTRAS_RUN" \
            --commit "$COMMIT")
          gh run download "$run_id" -n piano-extras -D build/in/piano-extras
          extras=build/in/piano-extras
          test -f "$extras/manifest.json"
          python3 - "$extras" <<'PYEOF'
          import importlib.util, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          # 包集合只有 publish-copr.py 的 EXTRAS_ORDER 一份真源：这里再抄一遍
          # 名单，加包时就只有一处会忘，发布停在一个假失败上。
          spec = importlib.util.spec_from_file_location(
              "publish_copr", Path("scripts/publish-copr.py"))
          publish_copr = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publish_copr)
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["status"] == "PIANO_EXTRAS_BUILT_NOT_DEVICE_VERIFIED"
          assert set(manifest["packages"]) == set(publish_copr.EXTRAS_ORDER), \
              sorted(manifest["packages"])
          for name in publish_copr.DESKTOP_PACKAGES:
              assert "piano1" in manifest["packages"][name]["release"], name
          PYEOF

          archive=build/extras-archive
          rm -rf "$archive"
          mkdir -p "$archive"
          cp -a "$extras/rpms" "$extras/srpms" "$extras/scripts" "$archive/"
          cp "$extras/manifest.json" "$extras/desktop-manifest.json" "$archive/"
          cat > "$archive/README-extras.txt" <<'EOF'
          可选的桌面补丁包。默认镜像不需要它。

          安装（GNOME 或 KDE 二选一）：

            sudo sh scripts/piano-extras-install.sh gnome
            sudo sh scripts/piano-extras-install.sh kde

          脚本会启用 xinyang26/piano-fedora-extras、把仓库优先级设为 1，再安装
          对应的 meta 包。装完注销并重新登录。

          卸载：

            sudo sh scripts/piano-extras-uninstall.sh

          仓库优先级会让 extras 的 KWin/GTK3 压过 Fedora 的更高版本，直到
          extras 按新版本重编。默认镜像和默认 COPR 不含这些包。
          EOF
          python3 scripts/release-assets.py write-sums "$archive"
          name=$(python3 scripts/release-assets.py extras-archive-name "$TAG")
          tar -C "$archive" --sort=name --mtime=@0 --owner=0 --group=0 \
            --numeric-owner -cf - . | zstd -10 -T0 --no-progress -o "$STAGE/$name"
          mkdir -p build/verify-extras
          tar -I zstd -xf "$STAGE/$name" -C build/verify-extras
          diff -r "$archive" build/verify-extras
          rm -rf build/verify-extras "$archive"

          release_upload_split "$STAGE/$name" "$name"
          sidecar=$(python3 scripts/release-assets.py extras-sidecar-name "$TAG")
          awk -v want="$name" '$2 == want || $2 ~ "^" want "\\.part-[0-9]+$"' \
            "$STAGE/RELEASE-SHA256SUMS" > "$STAGE/$sidecar"
          test -s "$STAGE/$sidecar"
          gh release upload "$TAG" "$STAGE/$sidecar"
          release_record "$STAGE/$sidecar" "$sidecar"

      - uses: actions/upload-artifact@v4
        with:
          name: release-sums-extras
          path: build/stage/RELEASE-SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: [plan, archive, extras]
    if: ${{ always() && needs.plan.result == 'success' && needs.archive.result == 'success' && (needs.extras.result == 'success' || needs.extras.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      STAGE: ${{ github.workspace }}/build/stage
      DESKTOPS: ${{ needs.plan.outputs.desktop_names }}
    steps:
      - uses: actions/checkout@v4

      # 每个 artifact 解到自己的目录：各档交上来的文件同名，合并会互相覆盖。
      - uses: actions/download-artifact@v4
        with:
          pattern: release-sums-*
          path: build/sums

      - name: Upload the release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . scripts/release-upload.sh
          mkdir -p "$STAGE"
          cat build/sums/*/RELEASE-SHA256SUMS > "$STAGE/RELEASE-SHA256SUMS"
          # 每个分片与 sidecar 只能被记一次；排序后再交上去。
          sort -k2 "$STAGE/RELEASE-SHA256SUMS" -o "$STAGE/RELEASE-SHA256SUMS"
          test -s "$STAGE/RELEASE-SHA256SUMS"
          gh release upload "$TAG" "$STAGE/RELEASE-SHA256SUMS"

      - name: Fill in the per-desktop table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # finalize 是另一个 job，工作区是干净的 checkout；plan 写下的
          # build/stage/notes.md 不在。正文只存在 draft 里，从这里取回来。
          mkdir -p build/stage
          gh release view "$TAG" --json body --jq .body > build/stage/notes.md
          grep -q '<!-- DESKTOP_TABLE_PLACEHOLDER -->' build/stage/notes.md || {
            echo "release notes lost the desktop table placeholder" >&2
            exit 2
          }
          : > build/stage/notes-table.md
          echo "| 档位 | 归档 | 分片数 | 下载量 | 特性与场景 |" >> build/stage/notes-table.md
          echo "| --- | --- | --- | --- | --- |" >> build/stage/notes-table.md
          for desktop in $DESKTOPS; do
            name=$(python3 scripts/release-assets.py archive-name "$TAG" "$desktop")
            read -r parts total <<<"$(python3 - "$TAG" "$name" <<'PYEOF'
          import json, re, subprocess, sys
          tag, name = sys.argv[1], sys.argv[2]
          assets = json.loads(subprocess.check_output(
              ["gh", "release", "view", tag, "--json", "assets"]))["assets"]
          pattern = re.compile(r"^" + re.escape(name) + r"(\.part-[0-9]+)?$")
          rows = [asset for asset in assets if pattern.match(asset["name"])]
          print(len(rows), sum(asset["size"] for asset in rows))
          PYEOF
          )"
            case "$desktop" in
              gnome)
                desc="GDM 自动登录；Wayland 原生会话，Mutter 自动旋转"
                ;;
              kde)
                desc="plasma-login-manager 自动登录；Wayland 原生会话，KWin 自动旋转（qt6-qtsensors）"
                ;;
              hyprland)
                desc="greetd [initial_session] 自动登录（tuigreet 兜底）；动态平铺，旋转需通过 hyprctl keyword monitor 调整"
                ;;
              niri)
                desc="greetd [initial_session] 自动登录（tuigreet 兜底）；无限横向滚动平铺，旋转需在 output 段声明 transform"
                ;;
              denial)
                desc="greetd [initial_session] 自动登录（tuigreet 兜底）；denial-session --start-locked 启动会话，默认桌面档"
                ;;
              *)
                desc="定制桌面环境"
                ;;
            esac
            echo "| \`${desktop}\` | \`${name}\` | ${parts} | $((total / 1048576)) MiB | ${desc} |" \
              >> build/stage/notes-table.md
          done
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          notes_path = Path("build/stage/notes.md")
          notes = notes_path.read_text()
          table = Path("build/stage/notes-table.md").read_text().strip()
          pattern = r"^[ \t]*<!-- DESKTOP_TABLE_PLACEHOLDER -->"
          new_notes, count = re.subn(pattern, table, notes, flags=re.MULTILINE)
          assert count == 1, "failed to replace DESKTOP_TABLE_PLACEHOLDER in notes.md"
          notes_path.write_text(new_notes)
          PYEOF
          gh release edit "$TAG" --notes-file build/stage/notes.md

      - name: Attest the published assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: build/stage/RELEASE-SHA256SUMS

      - name: Publish the release
        if: inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$PRERELEASE" = "true" ]; then
            extra+=(--prerelease)
          fi
          gh release edit "$TAG" --draft=false "${extra[@]}"
          gh release view "$TAG" --json url,assets,isDraft,isPrerelease \
            --jq '{url: .url, draft: .isDraft, prerelease: .isPrerelease,
                   assets: [.assets[] | {name, size}]}'

      - name: Leave the release as a draft
        if: inputs.publish != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "publish 未开启，${TAG} 保持 draft。" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url,isDraft \
            --jq '"draft=\(.isDraft) url=\(.url)"'
