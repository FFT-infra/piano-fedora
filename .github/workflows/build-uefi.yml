name: build-uefi

# 按 sources.lock.json 取 SunUEFI，构建 piano 的 UEFI 产品固件。
#
# 用 x86_64 runner：SunUEFI 的宿主机工具链是从 Debian amd64 提取的固定包
# （qemu-user、proot、libtalloc2），arm64 runner 上不适用。
#
# 不接触设备。
on:
  workflow_dispatch:
    inputs:
      sunuefi_ref:
        description: "SunUEFI ref（留空则用 sources.lock.json 的 commit）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned commits
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("sources.lock.json"))["sources"]
          print("sunuefi_url=" + lock["sunuefi"]["url"])
          print("sunuefi_commit=" + lock["sunuefi"]["commit"])
          PY
          cat "$GITHUB_OUTPUT"

      # 用 SunUEFI 官方的构建容器，而不是逐个补宿主依赖。
      # containers/Dockerfile 已列全所需包，包括 gettext、fonts-noto-cjk、
      # gcc/binutils-aarch64-linux-gnu、acpica-tools、mtools、dosfstools。
      # 手工装包会在长构建中途才暴露缺项，逐个试错代价高。
      - name: Build the official builder image
        run: |
          set -euo pipefail
          git clone --depth 1 "${{ steps.pins.outputs.sunuefi_url }}" sunuefi-image
          git -C sunuefi-image fetch --depth 1 origin "${{ steps.pins.outputs.sunuefi_commit }}"
          git -C sunuefi-image checkout FETCH_HEAD
          if ! docker build -t sunuefi-builder -f sunuefi-image/containers/Dockerfile sunuefi-image; then
            echo "ECR Public hit rate limits, falling back to Docker Hub with identical digest..."
            sed -i 's|public.ecr.aws/docker/library/debian@|docker.io/library/debian@|' sunuefi-image/containers/Dockerfile
            docker build -t sunuefi-builder -f sunuefi-image/containers/Dockerfile sunuefi-image
          fi

      - name: Clone SunUEFI at the pinned commit
        run: |
          set -euo pipefail
          REF="${{ inputs.sunuefi_ref }}"
          [ -n "$REF" ] || REF="${{ steps.pins.outputs.sunuefi_commit }}"
          git clone "${{ steps.pins.outputs.sunuefi_url }}" sunuefi
          git -C sunuefi checkout "$REF"
          echo "sunuefi at $(git -C sunuefi rev-parse HEAD)"

      - name: Apply project patches to SunUEFI
        run: |
          set -euo pipefail
          python3 scripts/apply-patches.py --sunuefi sunuefi

      - name: Build UEFI product firmware in the container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/sunuefi:/workspace" \
            -w /workspace \
            sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              source .venv/bin/activate
              pip install --quiet --upgrade pip
              pip install --quiet -r requirements-build.txt
              ./build.sh sources
              ./build.sh uefi
              # 模块 ZIP 装的是同一份 artifacts/product 的 fd/app/shim。已装设备
              # 换固件只走这条通道：它保留 Android 内核、BOOT 头尾与启动选择。
              # 只发 uefi 产物的话，用户只能装上游模块，我们的 UFS 与 DWC3 补丁
              # 就丢了。
              ./build.sh module
            '

      - name: Inspect UEFI artifacts
        working-directory: sunuefi
        run: |
          set -euo pipefail
          # 容器以 root 写入产物，检查与打包都要 sudo。
          sudo ls -lh artifacts/product/ artifacts/android/
          sudo cat artifacts/product/manifest.json 2>/dev/null || true
          # 模块与产品必须同源：ZIP 里的 fd/app/shim 要等于这份 product。
          sudo python3 - <<'PY'
          import json, sys, zipfile
          from pathlib import Path
          record = json.loads(Path("artifacts/android/manifest.json").read_text())
          package = Path("artifacts/android") / Path(record["zip"]).name
          assert package.is_file(), package
          product = json.loads(Path("artifacts/product/manifest.json").read_text())
          # files 里的每项是 {bytes, sha256}，不是裸摘要。
          image_sha = product["files"]["PianoUEFI-product.img"]["sha256"]
          assert record["same_product"]["product_sha256"] == image_sha, (
              "module belongs to another product")
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, "module ZIP is corrupt"
          print("module", package.name, record["zip_sha256"])
          PY

      - name: Package UEFI artifacts
        working-directory: sunuefi
        run: |
          set -euo pipefail
          sudo tar -I 'zstd -10 -T0' -cf "$GITHUB_WORKSPACE/uefi-product.tar.zst" \
            -C artifacts/product .
          # 模块单独一个 artifact：release 归档与装机脚本都按文件名取它。
          sudo tar -I 'zstd -10 -T0' -cf "$GITHUB_WORKSPACE/uefi-module.tar.zst" \
            -C artifacts/android .
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/uefi-product.tar.zst" \
            "$GITHUB_WORKSPACE/uefi-module.tar.zst"
          ls -lh "$GITHUB_WORKSPACE"/uefi-*.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: uefi-product
          path: uefi-product.tar.zst
          retention-days: 14
          compression-level: 1

      - uses: actions/upload-artifact@v4
        with:
          name: uefi-module
          path: uefi-module.tar.zst
          retention-days: 14
          compression-level: 1
