name: publish-copr

# Publish the user-space RPMs from one exact host-check run to Fedora COPR.
# COPR rebuilds them from the SRPMs the matrix produced, so the published
# repository is reproducible from source rather than a binary upload. This
# workflow never touches a device.
on:
  workflow_dispatch:
    inputs:
      rpms_run_id:
        description: "Successful host-check run that produced the piano-rpms artifact"
        required: true
        default: ""
      kernel_run_id:
        description: "Expected build-kernel run bound in the matrix manifest"
        required: true
        default: ""
      mesa_run_id:
        description: "Successful build-mesa run that produced piano-fedora-mesa"
        required: true
        default: ""
      ffmpeg_run_id:
        description: "Successful run (host-check) that produced piano-fedora-ffmpeg"
        required: true
        default: ""
      project:
        description: "COPR project (owner/name)"
        required: true
        default: "xinyang26/piano-fedora"
      execute:
        description: "false = validate only (dry-run); true = upload and wait for builds"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: ${{ !inputs.execute }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the exact RPM matrix run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RPMS_RUN: ${{ inputs.rpms_run_id }}
          MESA_RUN: ${{ inputs.mesa_run_id }}
          FFMPEG_RUN: ${{ inputs.ffmpeg_run_id }}
        run: |
          set -euo pipefail
          test -n "$RPMS_RUN" || { echo "rpms_run_id is required" >&2; exit 2; }
          test -n "${{ inputs.kernel_run_id }}" || { echo "kernel_run_id is required" >&2; exit 2; }
          python3 scripts/resolve-artifact-run.py \
            --workflow host-check.yml \
            --artifact piano-rpms \
            --run-id "$RPMS_RUN" \
            --output-key rpms_run
          # 图形栈来自各自的 workflow；build-ffmpeg.yml 是 workflow_call 复用件，
          # 实际 run 的 workflow_id 是 host-check。
          python3 scripts/resolve-artifact-run.py \
            --workflow build-mesa.yml \
            --artifact piano-fedora-mesa --run-id "$MESA_RUN" --output-key mesa_run
          python3 scripts/resolve-artifact-run.py \
            --workflow host-check.yml \
            --artifact piano-fedora-ffmpeg --run-id "$FFMPEG_RUN" --output-key ffmpeg_run

      - uses: actions/download-artifact@v4
        with:
          name: piano-rpms
          path: build/in/piano-rpms
          run-id: ${{ steps.source.outputs.rpms_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: piano-fedora-mesa
          path: build/in/mesa-artifact
          run-id: ${{ steps.source.outputs.mesa_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: piano-fedora-ffmpeg
          path: build/in/ffmpeg-artifact
          run-id: ${{ steps.source.outputs.ffmpeg_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack the graphics artifacts
        run: |
          set -euo pipefail
          # 两个 artifact 都是 tar.zst，manifest 在包内，所以先解再校验。
          mkdir -p build/in/mesa build/in/ffmpeg
          tar -I zstd -xf build/in/mesa-artifact/*.tar.zst -C build/in/mesa
          tar -I zstd -xf build/in/ffmpeg-artifact/*.tar.zst -C build/in/ffmpeg
          test -f build/in/mesa/manifest.json
          test -f build/in/ffmpeg/manifest.json
          test -d build/in/mesa/srpms
          test -d build/in/ffmpeg/srpms

      - name: Validate the artifact without publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/publish-copr.py \
            --run-id "${{ steps.source.outputs.rpms_run }}" \
            --kernel-run-id "${{ inputs.kernel_run_id }}" \
            --project "${{ inputs.project }}" \
            --rpms build/in/piano-rpms \
            --mesa build/in/mesa \
            --ffmpeg build/in/ffmpeg \
            --record build/copr-publication.json

      - uses: actions/upload-artifact@v4
        with:
          name: copr-publication
          path: build/copr-publication.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.execute }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the exact RPM matrix run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RPMS_RUN: ${{ inputs.rpms_run_id }}
          MESA_RUN: ${{ inputs.mesa_run_id }}
          FFMPEG_RUN: ${{ inputs.ffmpeg_run_id }}
        run: |
          set -euo pipefail
          test -n "$RPMS_RUN" || { echo "rpms_run_id is required" >&2; exit 2; }
          test -n "${{ inputs.kernel_run_id }}" || { echo "kernel_run_id is required" >&2; exit 2; }
          python3 scripts/resolve-artifact-run.py \
            --workflow host-check.yml \
            --artifact piano-rpms \
            --run-id "$RPMS_RUN" \
            --output-key rpms_run
          python3 scripts/resolve-artifact-run.py \
            --workflow build-mesa.yml \
            --artifact piano-fedora-mesa --run-id "$MESA_RUN" --output-key mesa_run
          python3 scripts/resolve-artifact-run.py \
            --workflow host-check.yml \
            --artifact piano-fedora-ffmpeg --run-id "$FFMPEG_RUN" --output-key ffmpeg_run

      - uses: actions/download-artifact@v4
        with:
          name: piano-rpms
          path: build/in/piano-rpms
          run-id: ${{ steps.source.outputs.rpms_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: piano-fedora-mesa
          path: build/in/mesa-artifact
          run-id: ${{ steps.source.outputs.mesa_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: piano-fedora-ffmpeg
          path: build/in/ffmpeg-artifact
          run-id: ${{ steps.source.outputs.ffmpeg_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack the graphics artifacts
        run: |
          set -euo pipefail
          mkdir -p build/in/mesa build/in/ffmpeg
          tar -I zstd -xf build/in/mesa-artifact/*.tar.zst -C build/in/mesa
          tar -I zstd -xf build/in/ffmpeg-artifact/*.tar.zst -C build/in/ffmpeg
          test -f build/in/mesa/manifest.json
          test -f build/in/ffmpeg/manifest.json
          test -d build/in/mesa/srpms
          test -d build/in/ffmpeg/srpms

      - name: Require COPR credentials
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          # Missing secrets must fail loudly here rather than half-publishing.
          test -n "$COPR_LOGIN" || { echo "COPR_LOGIN is not configured" >&2; exit 2; }
          test -n "$COPR_TOKEN" || { echo "COPR_TOKEN is not configured" >&2; exit 2; }

      - name: Install copr-cli
        run: |
          set -euo pipefail
          python3 -m venv build/copr-venv
          build/copr-venv/bin/pip install --quiet --disable-pip-version-check \
            "copr-cli==2.4"
          build/copr-venv/bin/copr-cli --version

      - name: Publish the exact matrix to COPR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_CLI: build/copr-venv/bin/copr-cli
        run: |
          set -euo pipefail
          python3 scripts/publish-copr.py \
            --run-id "${{ steps.source.outputs.rpms_run }}" \
            --kernel-run-id "${{ inputs.kernel_run_id }}" \
            --project "${{ inputs.project }}" \
            --rpms build/in/piano-rpms \
            --mesa build/in/mesa \
            --ffmpeg build/in/ffmpeg \
            --record build/copr-publication.json \
            --execute

      - uses: actions/upload-artifact@v4
        with:
          name: copr-publication
          path: build/copr-publication.json
          if-no-files-found: error
          retention-days: 30
